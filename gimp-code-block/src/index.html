<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GIMP Code Block — Plug-in Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #EDEFF8; --panel: #FFFFFF; --panel2: #F5F6FC; --ink: #1D2040; --muted: #5B6187; --line: #DDE1EF;
  --accent: #4B3FD1; --accent-soft: #ECEAFF; --go: #0B8B61; --go-hover: #08744F;
  --warn: #A96300; --warn-soft: #FFF3DF; --err: #C3342D; --err-soft: #FFE8E6; --info: #2F66C6; --ok-soft: #E2F6EE;
  --ws: #F4F5FB; --dot: #D3D7E8; --code-bg: #F8F9FD; --hl: #FFEFB8; --hl-bar: #F2B705;
  --k-kw: #7438D0; --k-str: #0A7A52; --k-num: #B35500; --k-com: #8A90AE; --k-fn: #1F5FC4; --k-const: #B02C68;
  --shadow: 0 1px 2px rgba(29, 32, 64, .06), 0 10px 30px rgba(29, 32, 64, .08);
  --font: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Code", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10121E; --panel: #181B2B; --panel2: #1E2236; --ink: #E9EBF8; --muted: #9EA4C8; --line: #2A2E46;
    --accent: #948BFF; --accent-soft: #28264A; --go: #1DB583; --go-hover: #27C992;
    --warn: #F0A63A; --warn-soft: #3A2C12; --err: #FF7A70; --err-soft: #3B1C1A; --info: #7FA8FF; --ok-soft: #13352A;
    --ws: #141626; --dot: #252943; --code-bg: #121526; --hl: #3D3414;
    --k-kw: #C39BFF; --k-str: #5FD6A6; --k-num: #FFB26B; --k-com: #6F769A; --k-fn: #8DB6FF; --k-const: #FF8DBE;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
  }
}
:root[data-theme="dark"] {
  --bg: #10121E; --panel: #181B2B; --panel2: #1E2236; --ink: #E9EBF8; --muted: #9EA4C8; --line: #2A2E46;
  --accent: #948BFF; --accent-soft: #28264A; --go: #1DB583; --go-hover: #27C992;
  --warn: #F0A63A; --warn-soft: #3A2C12; --err: #FF7A70; --err-soft: #3B1C1A; --info: #7FA8FF; --ok-soft: #13352A;
  --ws: #141626; --dot: #252943; --code-bg: #121526; --hl: #3D3414;
  --k-kw: #C39BFF; --k-str: #5FD6A6; --k-num: #FFB26B; --k-com: #6F769A; --k-fn: #8DB6FF; --k-const: #FF8DBE;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* barre du haut */
.top { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: nowrap; position: relative; z-index: 5; }
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
.brand svg { flex: none; }
.brand h1 { font-size: 18px; font-weight: 900; margin: 0; letter-spacing: -.2px; line-height: 1.1; }
.brand p { margin: 1px 0 0; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.search { flex: 1 1 200px; max-width: 400px; min-width: 150px; position: relative; }
.search input { width: 100%; padding: 9px 38px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--panel2); font-weight: 600; font-size: 14px; }
.search input:focus { border-color: var(--accent); outline: none; background: var(--panel); }
.search .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; font-size: 14px; }
.search kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font: 700 11px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; background: var(--panel); }
.actions { display: flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: nowrap; flex: none; }
.btn { border: 1.5px solid var(--line); background: var(--panel); border-radius: 11px; padding: 8px 13px; font-weight: 800; font-size: 13.5px; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--panel2); border-color: var(--muted); }
.btn.icon { padding: 8px 10px; font-size: 16px; line-height: 1; }
.btn.go { background: var(--go); border-color: var(--go); color: #fff; padding: 10px 16px; font-size: 14.5px; box-shadow: 0 6px 18px rgba(11, 139, 97, .28); }
.btn.go:hover { background: var(--go-hover); border-color: var(--go-hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.danger { color: var(--err); }
.badge { min-width: 20px; height: 20px; border-radius: 10px; padding: 0 6px; font-size: 12px; font-weight: 900; display: inline-grid; place-items: center; background: rgba(255, 255, 255, .25); }
.badge[hidden] { display: none; }
.badge.warn { background: #FFD27A; color: #4A2B00; }
.badge.err { background: #FFB3AD; color: #5A0B06; }
.menuWrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; min-width: 240px; display: none; z-index: 30; }
.menu.open { display: block; }
.menu button { display: flex; width: 100%; text-align: left; border: 0; background: none; padding: 9px 11px; border-radius: 8px; font-weight: 800; gap: 10px; }
.menu button:hover { background: var(--panel2); }
.menu small { display: block; color: var(--muted); font-weight: 600; font-size: 12.5px; }

/* zone principale */
main { flex: 1; display: flex; min-height: 0; }
#wsWrap { flex: 1; position: relative; min-width: 0; background-color: var(--ws); background-image: radial-gradient(var(--dot) 1.15px, transparent 1.35px); background-size: 18px 18px; }
#blockly { position: absolute; inset: 0; }
.wsTools { position: absolute; right: 22px; bottom: 22px; display: flex; gap: 4px; z-index: 4; background: var(--panel); border: 1px solid var(--line); border-radius: 13px; padding: 5px; box-shadow: var(--shadow); }
.wsTools button { border: 0; background: none; border-radius: 9px; min-width: 36px; height: 36px; font-weight: 900; font-size: 17px; padding: 0 9px; }
.wsTools button:hover { background: var(--panel2); }
.wsTools .txt { font-size: 13px; font-weight: 800; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-weight: 800; }

/* panneau latéral */
#side { width: clamp(330px, 31vw, 460px); background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; z-index: 3; }
.tabs { display: flex; gap: 4px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); }
.tab { flex: 1; white-space: nowrap; border: 0; background: none; padding: 10px 6px 11px; font-weight: 800; font-size: 13.5px; color: var(--muted); border-bottom: 3px solid transparent; border-radius: 8px 8px 0 0; display: inline-flex; justify-content: center; align-items: center; gap: 6px; }
.tab:hover { color: var(--ink); background: var(--panel2); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .badge { background: var(--panel2); color: var(--muted); }
.tab .badge.warn { background: var(--warn-soft); color: var(--warn); }
.tab .badge.err { background: var(--err-soft); color: var(--err); }
.pane { flex: 1; overflow: auto; padding: 18px 18px 28px; display: none; }
.pane.on { display: block; }
.pane h2 { font-size: 20px; font-weight: 900; margin: 8px 0 8px; line-height: 1.25; letter-spacing: -.2px; }
.pane h3 { font-size: 14.5px; font-weight: 900; margin: 20px 0 8px; }
.pane p { margin: 0 0 10px; }
.muted { color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 800; padding: 3px 11px; border-radius: 999px; color: #fff; }
.tip { background: var(--accent-soft); border-radius: 12px; padding: 11px 13px; margin: 12px 0; font-size: 14px; }
.steps { counter-reset: s; list-style: none; padding: 0; margin: 10px 0 0; }
.steps li { counter-increment: s; position: relative; padding: 2px 0 12px 40px; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-radius: 9px; background: var(--ink); color: var(--panel); font-weight: 900; display: grid; place-items: center; font-size: 14px; }
.gloss dt { font-weight: 900; margin-top: 10px; }
.gloss dd { margin: 2px 0 0; color: var(--muted); }
.fnlist { display: flex; flex-direction: column; gap: 8px; }
.fn { border: 1px solid var(--line); border-radius: 11px; padding: 9px 11px; background: var(--panel2); }
.fn code { font: 600 12.5px var(--mono); color: var(--k-fn); word-break: break-all; }
.fn .sig { font: 12px var(--mono); color: var(--muted); margin-top: 3px; word-break: break-word; }
.fn .bl { font-size: 13px; color: var(--muted); margin-top: 4px; }
.tag { font-size: 11.5px; font-weight: 800; padding: 1px 7px; border-radius: 6px; margin-left: 6px; background: var(--warn-soft); color: var(--warn); }
.snippet { font: 12.5px/1.6 var(--mono); background: var(--code-bg); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; overflow-x: auto; white-space: pre; }

/* code */
.codebar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.codebar .muted { font-size: 12.5px; flex: 1 1 100%; }
.code { font: 12.5px/1.65 var(--mono); background: var(--code-bg); border: 1px solid var(--line); border-radius: 12px; padding: 8px 0; overflow-x: auto; }
.code .ln { display: flex; min-width: max-content; padding-right: 14px; border-left: 3px solid transparent; }
.code .ln[data-id] { cursor: pointer; }
.code .ln:hover { background: rgba(127, 127, 160, .09); }
.code .ln.hl { background: var(--hl); border-left-color: var(--hl-bar); }
.code .no { width: 42px; flex: none; text-align: right; padding-right: 12px; color: var(--k-com); user-select: none; }
.code .tx { white-space: pre; }
.k-kw { color: var(--k-kw); font-weight: 600; } .k-str { color: var(--k-str); } .k-num { color: var(--k-num); }
.k-com { color: var(--k-com); font-style: italic; } .k-fn { color: var(--k-fn); } .k-const { color: var(--k-const); }

/* vérification */
.summary { border-radius: 14px; padding: 14px 15px; font-weight: 800; margin-bottom: 14px; display: flex; gap: 11px; align-items: flex-start; }
.summary.ok { background: var(--ok-soft); } .summary.warn { background: var(--warn-soft); } .summary.err { background: var(--err-soft); }
.summary .big { font-size: 22px; line-height: 1; }
.summary small { display: block; font-weight: 600; color: var(--muted); margin-top: 3px; }
.issue { display: flex; gap: 10px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; background: var(--panel); text-align: left; width: 100%; align-items: flex-start; }
.issue:hover { border-color: var(--muted); }
.issue .lv { flex: none; width: 22px; text-align: center; }
.issue.error { border-left: 4px solid var(--err); } .issue.warn { border-left: 4px solid var(--warn); } .issue.info { border-left: 4px solid var(--info); }
.issue .go { margin-left: auto; font-size: 12px; font-weight: 800; color: var(--accent); white-space: nowrap; }

/* Blockly */
#blockly .blocklySvg { background-color: transparent !important; }
#blockly .blocklyMainBackground { fill: transparent !important; stroke: none !important; }
.blocklyToolboxDiv { background: var(--panel) !important; border-right: 1px solid var(--line); padding: 10px 8px !important; }
.blocklyTreeRow { height: 38px !important; line-height: 38px !important; border-radius: 10px; margin: 1px 0 !important; padding-right: 12px !important; border-left-width: 7px !important; }
.blocklyTreeRow:not(.blocklyTreeSelected):hover { background: var(--panel2) !important; }
.blocklyTreeLabel { font-family: var(--font) !important; font-weight: 800 !important; font-size: 13.5px !important; color: var(--ink); }
.blocklyTreeSelected .blocklyTreeLabel { color: #fff !important; }
.blocklyTreeIcon { display: none !important; }
.blocklyFlyoutBackground { fill: var(--panel2) !important; fill-opacity: .98 !important; }
.gaIntro .blocklyFlyoutLabelText { font-family: var(--font) !important; font-weight: 900 !important; font-size: 18px !important; fill: var(--ink) !important; }
.gaSep .blocklyFlyoutLabelText { font-family: var(--font) !important; font-weight: 800 !important; font-size: 14.5px !important; fill: var(--muted) !important; }
.gaHint .blocklyFlyoutLabelText { font-family: var(--font) !important; font-weight: 600 !important; font-size: 14px !important; fill: var(--muted) !important; font-style: italic; }
.blocklyFlyoutButton .blocklyFlyoutButtonBackground { fill: var(--accent) !important; stroke: none !important; }
.blocklyFlyoutButton .blocklyText { fill: #fff !important; font-family: var(--font) !important; font-weight: 800 !important; }
.blocklyWidgetDiv .blocklyMenu, .blocklyDropDownDiv, .blocklyHtmlInput { font-family: var(--font) !important; font-weight: 700; }

/* fenêtres */
.overlay { position: fixed; inset: 0; background: rgba(12, 14, 32, .52); display: none; align-items: flex-start; justify-content: center; padding: 24px 14px; z-index: 80; overflow: auto; }
.overlay.open { display: flex; }
.dialog { background: var(--panel); border-radius: 18px; box-shadow: 0 24px 70px rgba(0, 0, 0, .35); width: 100%; max-width: 640px; padding: 22px 22px 18px; margin: auto 0; }
.dialog.wide { max-width: 920px; }
.dialog h2 { margin: 0 0 4px; font-size: 22px; font-weight: 900; letter-spacing: -.3px; }
.dialog .sub { color: var(--muted); margin: 0 0 16px; }
.dialog .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.dialog h3 { font-size: 15px; font-weight: 900; margin: 18px 0 8px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-weight: 800; font-size: 13.5px; margin-bottom: 4px; }
.field .hint { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.field input[type=text], .field textarea, .field select { width: 100%; padding: 9px 11px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--panel2); font-weight: 600; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); outline: none; background: var(--panel); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.checks label { display: flex; gap: 10px; align-items: flex-start; font-weight: 800; padding: 6px 0; }
.checks input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); flex: none; }
.checks small { display: block; color: var(--muted); font-weight: 600; }
.imports { display: flex; flex-wrap: wrap; gap: 6px; }
.imports label { display: inline-flex; gap: 6px; align-items: center; border: 1.5px solid var(--line); border-radius: 9px; padding: 4px 9px; font: 600 13px var(--mono); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.card { text-align: left; border: 1.5px solid var(--line); border-radius: 15px; background: var(--panel2); padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.card:hover { border-color: var(--accent); }
.card .em { font-size: 26px; line-height: 1; }
.card b { font-size: 15.5px; font-weight: 900; line-height: 1.3; }
.card span { color: var(--muted); font-size: 13.5px; }
.card small { font: 600 11.5px var(--mono); color: var(--muted); margin-top: auto; padding-top: 4px; }
.pickHead { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.pickHead input { flex: 1 1 240px; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--panel2); font-weight: 700; }
.pickHead select { padding: 9px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--panel2); font-weight: 700; max-width: 100%; }
.pickList { max-height: 55vh; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
.pick { text-align: left; border: 1.5px solid var(--line); background: var(--panel); border-radius: 11px; padding: 9px 11px; }
.pick:hover { border-color: var(--accent); background: var(--panel2); }
.pick code { font: 700 13px var(--mono); color: var(--k-fn); }
.pick .bl { display: block; font-size: 13px; color: var(--muted); }
.pick .ar { display: block; font: 12px var(--mono); color: var(--muted); margin-top: 2px; word-break: break-word; }
.status { border-radius: 13px; padding: 12px 14px; font-weight: 800; margin-bottom: 14px; }
.status.ok { background: var(--ok-soft); } .status.warn { background: var(--warn-soft); } .status.err { background: var(--err-soft); }
.path { font: 600 12.5px var(--mono); background: var(--code-bg); border: 1px solid var(--line); border-radius: 7px; padding: 1px 6px; word-break: break-all; }
.dlrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
textarea.copyzone { width: 100%; min-height: 220px; font: 12px var(--mono); border-radius: 10px; border: 1px solid var(--line); background: var(--code-bg); padding: 10px; }
.hero { display: grid; grid-template-columns: 1.15fr .85fr; gap: 22px; align-items: center; }
.hero h2 { font-size: 27px; line-height: 1.15; }
.stack { display: flex; flex-direction: column; transform: rotate(-2.5deg); }
.pb { color: #fff; font-weight: 900; font-size: 14px; padding: 10px 14px; border-radius: 9px; position: relative; width: fit-content; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .18); }
.pb.hat { border-radius: 22px 22px 9px 9px; padding-top: 16px; }
.pb.in { margin-left: 22px; }
.pb + .pb { margin-top: -1px; }
#toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--panel); padding: 11px 18px; border-radius: 12px; font-weight: 800; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 99; max-width: 90vw; }
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
#sideToggle { display: none; }
#dropHint { position: fixed; inset: 12px; border: 3px dashed var(--accent); border-radius: 22px; background: color-mix(in srgb, var(--panel) 88%, transparent); display: grid; place-items: center; font-size: 22px; font-weight: 900; z-index: 95; pointer-events: none; }
#dropHint[hidden] { display: none; }
.report li { margin-bottom: 6px; }
.okline { background: var(--ok-soft); border-radius: 12px; padding: 12px 14px; font-weight: 800; margin-bottom: 12px; }
.closeSheet { display: none; flex: 0 0 44px !important; }

@media (max-width: 1500px) { .brand p { display: none; } }
@media (max-width: 1250px) { .actions .lbl { display: none; } .brand h1 { font-size: 16px; } }
@media (max-width: 900px) {
  .top { gap: 8px; padding: 8px 10px; flex-wrap: wrap; }
  .brand { flex: 1 1 auto; }
  .actions { flex-wrap: wrap; justify-content: flex-end; }
  .brand h1 { font-size: 16px; }
  .search { order: 3; flex: 1 1 100%; max-width: none; }
  .actions .lbl { display: none; }
  .btn.go { padding: 9px 12px; font-size: 13.5px; }
  #side { position: fixed; left: 0; right: 0; bottom: 0; width: auto; height: 62%; border-left: 0; border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; box-shadow: var(--shadow); transform: translateY(105%); transition: transform .25s ease; z-index: 76; padding-bottom: env(safe-area-inset-bottom, 0px); }
  #side.open { transform: translateY(0); }
  .closeSheet { display: inline-flex; }
  #sideToggle { display: inline-flex; position: fixed; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 77; box-shadow: var(--shadow); }
  body.sheet-open #sideToggle { display: none; }
  .wsTools { bottom: calc(66px + env(safe-area-inset-bottom, 0px)); right: 12px; }
  .wsTools .txt { display: none; }
  .hero { grid-template-columns: 1fr; }
  .stack { display: none; }
  .row2 { grid-template-columns: 1fr; }
  .blocklyTreeLabel { font-size: 12.5px !important; }
}
@media (max-width: 520px) { .btn.go span:not(.badge) { display: none; } .btn.go::after { content: "Plug-in"; } }

/* barre de menus façon Notepad++ */
.menubar { display: flex; gap: 2px; align-items: center; flex-wrap: nowrap; }
.mb { position: relative; }
.mbBtn { border: 0; background: none; padding: 7px 10px; border-radius: 8px; font-weight: 800; font-size: 13.5px; color: var(--ink); white-space: nowrap; }
.mbBtn:hover, .mb.open .mbBtn { background: var(--panel2); }
.mb .menu { left: 0; right: auto; min-width: 270px; }
.mb.open .menu { display: block; }
.menu kbd { margin-left: auto; font: 600 11.5px var(--mono); color: var(--muted); padding-left: 14px; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 4px; }
.menu button span { flex: 1; }
body.noSide #side { display: none; }
#wsWrap.bgGrid { background-image: linear-gradient(var(--dot) 1px, transparent 1px), linear-gradient(90deg, var(--dot) 1px, transparent 1px); background-size: 24px 24px; }
#wsWrap.bgPlain { background-image: none; }
/* sélection multiple, silhouette, lasso */
.gaMulti > .blocklyPath { stroke: #FFB000 !important; stroke-width: 4px !important; }
.gaSil { position: fixed; z-index: 90; border: 2.5px dashed var(--accent); border-radius: 12px; background: color-mix(in srgb, var(--accent) 10%, transparent); pointer-events: none; display: flex; align-items: flex-start; justify-content: flex-start; }
.gaSil span { background: var(--accent); color: #fff; font-weight: 900; font-size: 13px; padding: 3px 10px; border-radius: 0 0 10px 0; }
.gaLasso { position: fixed; z-index: 90; border: 2px dashed #FFB000; background: rgba(255, 176, 0, .12); pointer-events: none; }
#selBar { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 6; display: flex; gap: 4px; align-items: center; background: var(--ink); color: var(--panel); border-radius: 14px; padding: 5px 6px 5px 14px; box-shadow: var(--shadow); max-width: calc(100% - 24px); flex-wrap: wrap; }
#selBar[hidden] { display: none; }
#selBar .selN { font-weight: 900; font-size: 13.5px; margin-right: 6px; }
#selBar button { border: 0; background: rgba(255, 255, 255, .12); color: inherit; border-radius: 9px; padding: 6px 10px; font-weight: 800; font-size: 13px; }
#selBar button:hover { background: rgba(255, 255, 255, .24); }
#selBar button.ai { background: var(--accent); color: #fff; }
/* rechercher / remplacer */
#findBar { position: absolute; top: 12px; right: 22px; z-index: 7; background: var(--panel); border: 1px solid var(--line); border-radius: 13px; box-shadow: var(--shadow); padding: 7px; display: flex; flex-direction: column; gap: 6px; }
#findBar[hidden] { display: none; }
#findBar .fr1, #findBar .fr2 { display: flex; gap: 5px; align-items: center; }
#findBar .fr2 { display: none; }
#findBar.rep .fr2 { display: flex; }
#findBar input[type=search], #findBar input[type=text] { width: 220px; padding: 6px 9px; border: 1.5px solid var(--line); border-radius: 9px; background: var(--panel2); font-weight: 600; }
#findBar button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 9px; font-weight: 800; font-size: 12.5px; }
#findBar label { font: 700 12px var(--mono); display: inline-flex; align-items: center; gap: 3px; color: var(--muted); }
#findBar #fN { font-size: 12px; min-width: 64px; text-align: center; }
/* tutoriel */
#tour { position: fixed; inset: 0; z-index: 120; }
#tour[hidden] { display: none; }
.tourHole { position: fixed; border-radius: 12px; box-shadow: 0 0 0 9999px rgba(10, 12, 30, .6); transition: all .25s ease; pointer-events: none; outline: 3px solid #FFC933; }
.tourCard { position: fixed; width: min(380px, calc(100vw - 24px)); background: var(--panel); border-radius: 16px; box-shadow: 0 20px 60px rgba(0, 0, 0, .4); padding: 16px 18px 12px; }
.tourCard.center { left: 50% !important; top: 50% !important; transform: translate(-50%, -50%); width: min(520px, calc(100vw - 24px)); }
#tour .tourHole[hidden] + .tourCard { box-shadow: 0 0 0 9999px rgba(10, 12, 30, .6), 0 20px 60px rgba(0, 0, 0, .4); }
.tourCard h3 { margin: 4px 0 8px; font-size: 18px; font-weight: 900; }
.tourCard .n { font: 800 12px var(--mono); color: var(--muted); }
.tourCard .tx { font-size: 14.5px; line-height: 1.55; margin-bottom: 12px; }
/* IA */
.aiHead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
#p-ai textarea { width: 100%; padding: 10px 12px; border-radius: 11px; border: 1.5px solid var(--line); background: var(--panel2); font-weight: 600; resize: vertical; }
#p-ai textarea:focus { border-color: var(--accent); outline: none; background: var(--panel); }
#aiLog { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.aiMsg { border-radius: 13px; padding: 10px 12px; font-size: 14px; }
.aiMsg.user { background: var(--accent-soft); align-self: flex-end; max-width: 92%; white-space: pre-wrap; }
.aiMsg.bot { background: var(--panel2); border: 1px solid var(--line); }
.aiMsg .st { font-weight: 800; margin-bottom: 6px; }
.aiMsg pre.live { font: 11.5px/1.5 var(--mono); max-height: 180px; overflow: auto; white-space: pre-wrap; color: var(--muted); margin: 0; }
.aiMsg .aiCode { max-height: 320px; overflow: auto; }
.aiMsg .aiText { white-space: pre-wrap; margin-top: 8px; font-size: 13.5px; }
.aiChecks { list-style: none; padding: 0; margin: 0 0 8px; font-size: 13px; }
.aiChecks li { padding: 2px 0; }
.aiChecks li.err { color: var(--err); font-weight: 700; }
.aiChecks li.warn { color: var(--warn); }
/* apparence */
.presetRow { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-bottom: 14px; }
.preset.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.swatch { display: flex; gap: 8px; align-items: center; font-weight: 700; font-size: 13px; }
.swatch input { width: 36px; height: 28px; border: 0; background: none; padding: 0; }
input[type=range] { width: 100%; accent-color: var(--accent); }
table.keys { border-collapse: collapse; width: 100%; font-size: 14px; }
table.keys td { padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.keys kbd { font: 700 12px var(--mono); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; white-space: nowrap; }
@media (max-width: 1350px) { .brand h1 { display: none; } }
@media (max-width: 1150px) { .search { display: none; } }
@media (max-width: 900px) { .menubar { order: 3; flex: 1 1 100%; overflow-x: auto; } .search { display: block; } .mb .menu { position: fixed; left: 8px; right: 8px; top: auto; } #findBar input[type=search] { width: 140px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="38" height="38" viewBox="0 0 38 38" aria-hidden="true">
      <path d="M4 7a4 4 0 0 1 4-4h8l2 2.5h4L24 3h6a4 4 0 0 1 4 4v4a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z" fill="#C8930A"/>
      <path d="M8 16h8l2 2.5h4l2-2.5h6a3 3 0 0 1 3 3v3a3 3 0 0 1-3 3H11a3 3 0 0 1-3-3z" fill="#7556E0"/>
      <path d="M4 27h12l2 2.5h4l2-2.5h7a3 3 0 0 1 3 3v2a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z" fill="#139E90"/>
    </svg>
    <div><h1>GIMP Code Block</h1></div>
  </div>
  <nav class="menubar" aria-label="Menus">
    <div class="mb"><button class="mbBtn" aria-haspopup="true" aria-expanded="false" id="bProject">Fichier</button><div class="menu" role="menu">
        <button role="menuitem" id="mNew"><span>🆕 Nouveau plug-in</span></button>
        <button role="menuitem" id="mOpen"><span>📂 Ouvrir un projet</span></button>
        <button role="menuitem" id="mImport"><span>🐍 Importer un script Python</span><kbd>Ctrl+O</kbd></button>
        <button role="menuitem" id="mPaste"><span>📋 Coller du code Python</span></button>
        <button role="menuitem" id="mSave"><span>💾 Sauvegarder le projet</span><kbd>Ctrl+S</kbd></button>
        <hr>
        <button role="menuitem" id="bExamples"><span>✨ Exemples</span></button>
        <button role="menuitem" id="mConvert"><span>🔁 Voir ce plug-in en blocs Python</span></button>
        <hr>
        <button role="menuitem" id="bDl3"><span>⬇ Télécharger le plug-in</span></button>
        <button role="menuitem" data-act="downloadAtelier"><span>🧳 Télécharger l'atelier (pour l'ouvrir chez toi)</span></button>
    </div></div>
    <div class="mb"><button class="mbBtn" aria-haspopup="true" aria-expanded="false">Édition</button><div class="menu" role="menu">
        <button role="menuitem" data-act="undo"><span>↶ Annuler</span><kbd>Ctrl+Z</kbd></button>
        <button role="menuitem" data-act="redo"><span>↷ Rétablir</span><kbd>Ctrl+Y</kbd></button>
        <hr>
        <button role="menuitem" data-act="cut"><span>✂️ Couper</span><kbd>Ctrl+X</kbd></button>
        <button role="menuitem" data-act="copy"><span>📋 Copier</span><kbd>Ctrl+C</kbd></button>
        <button role="menuitem" data-act="paste"><span>📥 Coller</span><kbd>Ctrl+V</kbd></button>
        <button role="menuitem" data-act="duplicate"><span>⧉ Dupliquer</span><kbd>Ctrl+D</kbd></button>
        <button role="menuitem" data-act="del"><span>🗑 Supprimer la sélection</span><kbd>Suppr</kbd></button>
        <hr>
        <button role="menuitem" data-act="selectAll"><span>☑️ Tout sélectionner</span><kbd>Ctrl+A</kbd></button>
        <button role="menuitem" data-act="selectNone"><span>⬜ Vider la sélection</span><kbd>Échap</kbd></button>
        <hr>
        <button role="menuitem" data-act="tidy"><span>🧹 Ranger les blocs</span></button>
    </div></div>
    <div class="mb"><button class="mbBtn" aria-haspopup="true" aria-expanded="false">Recherche</button><div class="menu" role="menu">
        <button role="menuitem" data-act="find"><span>🔍 Rechercher…</span><kbd>Ctrl+F</kbd></button>
        <button role="menuitem" data-act="replace"><span>🔁 Remplacer…</span><kbd>Ctrl+H</kbd></button>
        <button role="menuitem" data-act="functions"><span>📋 Liste des fonctions…</span><kbd>Ctrl+G</kbd></button>
        <button role="menuitem" data-act="blockSearch"><span>🧩 Chercher un bloc à ajouter</span><kbd>/</kbd></button>
    </div></div>
    <div class="mb"><button class="mbBtn" aria-haspopup="true" aria-expanded="false">Affichage</button><div class="menu" role="menu">
        <button role="menuitem" data-act="collapseAll"><span>📁 Replier toutes les fonctions</span><kbd>Alt+0</kbd></button>
        <button role="menuitem" data-act="expandAll"><span>📂 Tout déplier</span><kbd>Alt+Maj+0</kbd></button>
        <button role="menuitem" data-act="expandSel"><span>📂 Déplier la sélection en profondeur</span></button>
        <button role="menuitem" data-act="collapseSel"><span>📁 Replier la sélection</span></button>
        <hr>
        <button role="menuitem" data-act="zoomIn"><span>➕ Zoomer</span></button>
        <button role="menuitem" data-act="zoomOut"><span>➖ Dézoomer</span></button>
        <button role="menuitem" data-act="zoom100"><span>🔎 Zoom 100 %</span></button>
        <button role="menuitem" data-act="zoomFit"><span>🖼️ Tout voir</span></button>
        <hr>
        <button role="menuitem" data-act="toggleSide"><span>◧ Afficher / masquer le panneau</span></button>
        <button role="menuitem" data-act="theme"><span>🌓 Mode clair / sombre</span></button>
    </div></div>
    <div class="mb"><button class="mbBtn" aria-haspopup="true" aria-expanded="false">Paramètres</button><div class="menu" role="menu">
        <button role="menuitem" data-act="appearance"><span>🎨 Apparence des blocs et de l'interface…</span></button>
        <button role="menuitem" id="bSettings"><span>⚙️ Mon plug-in…</span></button>
        <button role="menuitem" data-act="aiSettings"><span>🤖 Réglages IA…</span></button>
    </div></div>
    <div class="mb"><button class="mbBtn" aria-haspopup="true" aria-expanded="false">IA</button><div class="menu" role="menu">
        <button role="menuitem" data-act="aiPanel"><span>🤖 Ouvrir l'assistant IA</span></button>
        <button role="menuitem" data-act="aiSettings"><span>⚙️ Choisir l'IA (fournisseur, clé)…</span></button>
        <hr>
        <button role="menuitem" data-act="downloadAtelier"><span>🧳 Télécharger l'atelier (pour ton IA locale)</span></button>
    </div></div>
    <div class="mb"><button class="mbBtn" aria-haspopup="true" aria-expanded="false">🌐 Langue</button><div class="menu" role="menu">
        <button role="menuitem" data-act="langFr"><span>🇫🇷 Français</span></button>
        <button role="menuitem" data-act="langEn"><span>🇬🇧 English</span></button>
    </div></div>
    <div class="mb"><button class="mbBtn" aria-haspopup="true" aria-expanded="false">Aide</button><div class="menu" role="menu">
        <button role="menuitem" data-act="tour"><span>🎓 Tutoriel (2 min)</span><kbd>F1</kbd></button>
        <button role="menuitem" id="mWelcome"><span>👋 Revoir l'accueil</span></button>
        <button role="menuitem" data-act="shortcuts"><span>⌨️ Raccourcis clavier</span></button>
        <button role="menuitem" data-act="about"><span>ℹ️ À propos</span></button>
    </div></div>
  </nav>
  <div class="search" role="search">
    <span class="ico" aria-hidden="true">🔎</span>
    <label class="sr" for="q">Chercher un bloc</label>
    <input id="q" type="search" autocomplete="off" placeholder="Chercher un bloc : calque, bulle, texte…">
    <kbd aria-hidden="true">/</kbd>
  </div>
  <div class="actions">
    <button class="btn icon" id="bUndo" title="Annuler (Ctrl+Z)" aria-label="Annuler">↶</button>
    <button class="btn icon" id="bRedo" title="Rétablir (Ctrl+Y)" aria-label="Rétablir">↷</button>
    <button class="btn go" id="bDownload">⬇ <span>Télécharger le plug-in</span><span class="badge" id="dlBadge" hidden></span></button>
  </div>
</header>
<main>
  <section id="wsWrap" aria-label="Zone de construction">
    <div id="loading">Chargement des blocs…</div>
    <div id="blockly"></div>
    <div id="selBar" hidden><span class="selN"></span><button data-sel="copy">📋 <span>Copier</span></button><button data-sel="cut">✂️ <span>Couper</span></button><button data-sel="dup">⧉ <span>Dupliquer</span></button><button data-sel="unfold">📂 <span>Déplier</span></button><button data-sel="del">🗑 <span>Supprimer</span></button><button data-sel="ai" class="ai">🤖 <span>Demander à l'IA</span></button><button data-sel="clear" title="Échap">✕</button></div>
    <div id="findBar" hidden><div class="fr1"><input id="fQ" type="search" placeholder="Rechercher dans les blocs…" autocomplete="off"><span id="fN" class="muted"></span><button id="fPrev" title="Précédent (Maj+Entrée)">▲</button><button id="fNext" title="Suivant (Entrée)">▼</button><label title="Respecter les majuscules"><input type="checkbox" id="fC">Aa</label><label title="Mot entier"><input type="checkbox" id="fW">[mot]</label><button id="fClose" title="Fermer (Échap)">✕</button></div><div class="fr2"><input id="fR" type="text" placeholder="Remplacer par…" autocomplete="off"><button id="fRep">Remplacer</button><button id="fRepAll">Tout remplacer</button></div></div>
    <div class="wsTools" role="toolbar" aria-label="Affichage">
      <button id="zOut" title="Dézoomer" aria-label="Dézoomer">−</button>
      <button id="zFit" class="txt" title="Tout voir">Tout voir</button>
      <button id="zIn" title="Zoomer" aria-label="Zoomer">+</button>
      <button id="zTidy" class="txt" title="Ranger les blocs">Ranger</button>
    </div>
  </section>
  <aside id="side" aria-label="Aide, code et vérification">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-help" aria-selected="true" data-pane="help">💡 Aide</button>
      <button class="tab" role="tab" id="t-code" aria-selected="false" data-pane="code">🐍 Code</button>
      <button class="tab" role="tab" id="t-check" aria-selected="false" data-pane="check">✅ Vérification <span class="badge" id="chkBadge">0</span></button>
      <button class="tab" role="tab" id="t-ai" aria-selected="false" data-pane="ai">🤖 IA</button>
      <button class="tab closeSheet" id="sheetClose" aria-label="Fermer le panneau">✕</button>
    </div>
    <div class="pane on" id="p-help" role="tabpanel"></div>
    <div class="pane" id="p-code" role="tabpanel">
      <div class="codebar">
        <button class="btn" id="bCopy">📋 Copier le code</button>
        <button class="btn" id="bDl2">⬇ Télécharger</button>
        <span class="muted">Clique sur un bloc : ses lignes s'allument. Clique sur une ligne : son bloc est sélectionné.</span>
      </div>
      <div class="code" id="code"></div>
    </div>
    <div class="pane" id="p-check" role="tabpanel"></div>
    <div class="pane" id="p-ai" role="tabpanel"></div>
  </aside>
</main>
<button class="btn primary" id="sideToggle">💡 Aide & code</button>
<input type="file" id="fileOpen" accept=".json,.py,.zip,.txt,application/json,text/x-python,application/zip,text/plain" hidden>
<div id="dropHint" hidden>📥 Lâche ton fichier .py, .zip ou .json ici</div>
<div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="dialog" id="dialog"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="tour" hidden><div class="tourHole" hidden></div><div class="tourCard"><div class="n"></div><h3></h3><div class="tx"></div><div class="dlrow"><button class="btn skip">Passer</button><span style="flex:1"></span><button class="btn prev">Précédent</button><button class="btn primary next">Suivant</button></div></div></div>
<!--SCRIPTS-->
</body>
</html>
