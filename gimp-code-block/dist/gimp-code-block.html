<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GIMP Code Block — Plug-in Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #EDEFF8; --panel: #FFFFFF; --panel2: #F5F6FC; --ink: #1D2040; --muted: #5B6187; --line: #DDE1EF;
  --accent: #4B3FD1; --accent-soft: #ECEAFF; --go: #0B8B61; --go-hover: #08744F;
  --warn: #A96300; --warn-soft: #FFF3DF; --err: #C3342D; --err-soft: #FFE8E6; --info: #2F66C6; --ok-soft: #E2F6EE;
  --ws: #F4F5FB; --dot: #D3D7E8; --code-bg: #F8F9FD; --hl: #FFEFB8; --hl-bar: #F2B705;
  --k-kw: #7438D0; --k-str: #0A7A52; --k-num: #B35500; --k-com: #8A90AE; --k-fn: #1F5FC4; --k-const: #B02C68;
  --shadow: 0 1px 2px rgba(29, 32, 64, .06), 0 10px 30px rgba(29, 32, 64, .08);
  --font: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Code", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10121E; --panel: #181B2B; --panel2: #1E2236; --ink: #E9EBF8; --muted: #9EA4C8; --line: #2A2E46;
    --accent: #948BFF; --accent-soft: #28264A; --go: #1DB583; --go-hover: #27C992;
    --warn: #F0A63A; --warn-soft: #3A2C12; --err: #FF7A70; --err-soft: #3B1C1A; --info: #7FA8FF; --ok-soft: #13352A;
    --ws: #141626; --dot: #252943; --code-bg: #121526; --hl: #3D3414;
    --k-kw: #C39BFF; --k-str: #5FD6A6; --k-num: #FFB26B; --k-com: #6F769A; --k-fn: #8DB6FF; --k-const: #FF8DBE;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
  }
}
:root[data-theme="dark"] {
  --bg: #10121E; --panel: #181B2B; --panel2: #1E2236; --ink: #E9EBF8; --muted: #9EA4C8; --line: #2A2E46;
  --accent: #948BFF; --accent-soft: #28264A; --go: #1DB583; --go-hover: #27C992;
  --warn: #F0A63A; --warn-soft: #3A2C12; --err: #FF7A70; --err-soft: #3B1C1A; --info: #7FA8FF; --ok-soft: #13352A;
  --ws: #141626; --dot: #252943; --code-bg: #121526; --hl: #3D3414;
  --k-kw: #C39BFF; --k-str: #5FD6A6; --k-num: #FFB26B; --k-com: #6F769A; --k-fn: #8DB6FF; --k-const: #FF8DBE;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* barre du haut */
.top { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: nowrap; position: relative; z-index: 5; }
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
.brand svg { flex: none; }
.brand h1 { font-size: 18px; font-weight: 900; margin: 0; letter-spacing: -.2px; line-height: 1.1; }
.brand p { margin: 1px 0 0; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.search { flex: 1 1 200px; max-width: 400px; min-width: 150px; position: relative; }
.search input { width: 100%; padding: 9px 38px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--panel2); font-weight: 600; font-size: 14px; }
.search input:focus { border-color: var(--accent); outline: none; background: var(--panel); }
.search .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; font-size: 14px; }
.search kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font: 700 11px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; background: var(--panel); }
.actions { display: flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: nowrap; flex: none; }
.btn { border: 1.5px solid var(--line); background: var(--panel); border-radius: 11px; padding: 8px 13px; font-weight: 800; font-size: 13.5px; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--panel2); border-color: var(--muted); }
.btn.icon { padding: 8px 10px; font-size: 16px; line-height: 1; }
.btn.go { background: var(--go); border-color: var(--go); color: #fff; padding: 10px 16px; font-size: 14.5px; box-shadow: 0 6px 18px rgba(11, 139, 97, .28); }
.btn.go:hover { background: var(--go-hover); border-color: var(--go-hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.danger { color: var(--err); }
.badge { min-width: 20px; height: 20px; border-radius: 10px; padding: 0 6px; font-size: 12px; font-weight: 900; display: inline-grid; place-items: center; background: rgba(255, 255, 255, .25); }
.badge[hidden] { display: none; }
.badge.warn { background: #FFD27A; color: #4A2B00; }
.badge.err { background: #FFB3AD; color: #5A0B06; }
.menuWrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; min-width: 240px; display: none; z-index: 30; }
.menu.open { display: block; }
.menu button { display: flex; width: 100%; text-align: left; border: 0; background: none; padding: 9px 11px; border-radius: 8px; font-weight: 800; gap: 10px; }
.menu button:hover { background: var(--panel2); }
.menu small { display: block; color: var(--muted); font-weight: 600; font-size: 12.5px; }

/* zone principale */
main { flex: 1; display: flex; min-height: 0; }
#wsWrap { flex: 1; position: relative; min-width: 0; background-color: var(--ws); background-image: radial-gradient(var(--dot) 1.15px, transparent 1.35px); background-size: 18px 18px; }
#blockly { position: absolute; inset: 0; }
.wsTools { position: absolute; right: 22px; bottom: 22px; display: flex; gap: 4px; z-index: 4; background: var(--panel); border: 1px solid var(--line); border-radius: 13px; padding: 5px; box-shadow: var(--shadow); }
.wsTools button { border: 0; background: none; border-radius: 9px; min-width: 36px; height: 36px; font-weight: 900; font-size: 17px; padding: 0 9px; }
.wsTools button:hover { background: var(--panel2); }
.wsTools .txt { font-size: 13px; font-weight: 800; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-weight: 800; }

/* panneau latéral */
#side { width: clamp(330px, 31vw, 460px); background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; z-index: 3; }
.tabs { display: flex; gap: 4px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); }
.tab { flex: 1; white-space: nowrap; border: 0; background: none; padding: 10px 6px 11px; font-weight: 800; font-size: 13.5px; color: var(--muted); border-bottom: 3px solid transparent; border-radius: 8px 8px 0 0; display: inline-flex; justify-content: center; align-items: center; gap: 6px; }
.tab:hover { color: var(--ink); background: var(--panel2); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .badge { background: var(--panel2); color: var(--muted); }
.tab .badge.warn { background: var(--warn-soft); color: var(--warn); }
.tab .badge.err { background: var(--err-soft); color: var(--err); }
.pane { flex: 1; overflow: auto; padding: 18px 18px 28px; display: none; }
.pane.on { display: block; }
.pane h2 { font-size: 20px; font-weight: 900; margin: 8px 0 8px; line-height: 1.25; letter-spacing: -.2px; }
.pane h3 { font-size: 14.5px; font-weight: 900; margin: 20px 0 8px; }
.pane p { margin: 0 0 10px; }
.muted { color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 800; padding: 3px 11px; border-radius: 999px; color: #fff; }
.tip { background: var(--accent-soft); border-radius: 12px; padding: 11px 13px; margin: 12px 0; font-size: 14px; }
.steps { counter-reset: s; list-style: none; padding: 0; margin: 10px 0 0; }
.steps li { counter-increment: s; position: relative; padding: 2px 0 12px 40px; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-radius: 9px; background: var(--ink); color: var(--panel); font-weight: 900; display: grid; place-items: center; font-size: 14px; }
.gloss dt { font-weight: 900; margin-top: 10px; }
.gloss dd { margin: 2px 0 0; color: var(--muted); }
.fnlist { display: flex; flex-direction: column; gap: 8px; }
.fn { border: 1px solid var(--line); border-radius: 11px; padding: 9px 11px; background: var(--panel2); }
.fn code { font: 600 12.5px var(--mono); color: var(--k-fn); word-break: break-all; }
.fn .sig { font: 12px var(--mono); color: var(--muted); margin-top: 3px; word-break: break-word; }
.fn .bl { font-size: 13px; color: var(--muted); margin-top: 4px; }
.tag { font-size: 11.5px; font-weight: 800; padding: 1px 7px; border-radius: 6px; margin-left: 6px; background: var(--warn-soft); color: var(--warn); }
.snippet { font: 12.5px/1.6 var(--mono); background: var(--code-bg); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; overflow-x: auto; white-space: pre; }

/* code */
.codebar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.codebar .muted { font-size: 12.5px; flex: 1 1 100%; }
.code { font: 12.5px/1.65 var(--mono); background: var(--code-bg); border: 1px solid var(--line); border-radius: 12px; padding: 8px 0; overflow-x: auto; }
.code .ln { display: flex; min-width: max-content; padding-right: 14px; border-left: 3px solid transparent; }
.code .ln[data-id] { cursor: pointer; }
.code .ln:hover { background: rgba(127, 127, 160, .09); }
.code .ln.hl { background: var(--hl); border-left-color: var(--hl-bar); }
.code .no { width: 42px; flex: none; text-align: right; padding-right: 12px; color: var(--k-com); user-select: none; }
.code .tx { white-space: pre; }
.k-kw { color: var(--k-kw); font-weight: 600; } .k-str { color: var(--k-str); } .k-num { color: var(--k-num); }
.k-com { color: var(--k-com); font-style: italic; } .k-fn { color: var(--k-fn); } .k-const { color: var(--k-const); }

/* vérification */
.summary { border-radius: 14px; padding: 14px 15px; font-weight: 800; margin-bottom: 14px; display: flex; gap: 11px; align-items: flex-start; }
.summary.ok { background: var(--ok-soft); } .summary.warn { background: var(--warn-soft); } .summary.err { background: var(--err-soft); }
.summary .big { font-size: 22px; line-height: 1; }
.summary small { display: block; font-weight: 600; color: var(--muted); margin-top: 3px; }
.issue { display: flex; gap: 10px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; background: var(--panel); text-align: left; width: 100%; align-items: flex-start; }
.issue:hover { border-color: var(--muted); }
.issue .lv { flex: none; width: 22px; text-align: center; }
.issue.error { border-left: 4px solid var(--err); } .issue.warn { border-left: 4px solid var(--warn); } .issue.info { border-left: 4px solid var(--info); }
.issue .go { margin-left: auto; font-size: 12px; font-weight: 800; color: var(--accent); white-space: nowrap; }

/* Blockly */
#blockly .blocklySvg { background-color: transparent !important; }
#blockly .blocklyMainBackground { fill: transparent !important; stroke: none !important; }
.blocklyToolboxDiv { background: var(--panel) !important; border-right: 1px solid var(--line); padding: 10px 8px !important; }
.blocklyTreeRow { height: 38px !important; line-height: 38px !important; border-radius: 10px; margin: 1px 0 !important; padding-right: 12px !important; border-left-width: 7px !important; }
.blocklyTreeRow:not(.blocklyTreeSelected):hover { background: var(--panel2) !important; }
.blocklyTreeLabel { font-family: var(--font) !important; font-weight: 800 !important; font-size: 13.5px !important; color: var(--ink); }
.blocklyTreeSelected .blocklyTreeLabel { color: #fff !important; }
.blocklyTreeIcon { display: none !important; }
.blocklyFlyoutBackground { fill: var(--panel2) !important; fill-opacity: .98 !important; }
.gaIntro .blocklyFlyoutLabelText { font-family: var(--font) !important; font-weight: 900 !important; font-size: 18px !important; fill: var(--ink) !important; }
.gaSep .blocklyFlyoutLabelText { font-family: var(--font) !important; font-weight: 800 !important; font-size: 14.5px !important; fill: var(--muted) !important; }
.gaHint .blocklyFlyoutLabelText { font-family: var(--font) !important; font-weight: 600 !important; font-size: 14px !important; fill: var(--muted) !important; font-style: italic; }
.blocklyFlyoutButton .blocklyFlyoutButtonBackground { fill: var(--accent) !important; stroke: none !important; }
.blocklyFlyoutButton .blocklyText { fill: #fff !important; font-family: var(--font) !important; font-weight: 800 !important; }
.blocklyWidgetDiv .blocklyMenu, .blocklyDropDownDiv, .blocklyHtmlInput { font-family: var(--font) !important; font-weight: 700; }

/* fenêtres */
.overlay { position: fixed; inset: 0; background: rgba(12, 14, 32, .52); display: none; align-items: flex-start; justify-content: center; padding: 24px 14px; z-index: 80; overflow: auto; }
.overlay.open { display: flex; }
.dialog { background: var(--panel); border-radius: 18px; box-shadow: 0 24px 70px rgba(0, 0, 0, .35); width: 100%; max-width: 640px; padding: 22px 22px 18px; margin: auto 0; }
.dialog.wide { max-width: 920px; }
.dialog h2 { margin: 0 0 4px; font-size: 22px; font-weight: 900; letter-spacing: -.3px; }
.dialog .sub { color: var(--muted); margin: 0 0 16px; }
.dialog .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.dialog h3 { font-size: 15px; font-weight: 900; margin: 18px 0 8px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-weight: 800; font-size: 13.5px; margin-bottom: 4px; }
.field .hint { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.field input[type=text], .field textarea, .field select { width: 100%; padding: 9px 11px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--panel2); font-weight: 600; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); outline: none; background: var(--panel); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.checks label { display: flex; gap: 10px; align-items: flex-start; font-weight: 800; padding: 6px 0; }
.checks input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); flex: none; }
.checks small { display: block; color: var(--muted); font-weight: 600; }
.imports { display: flex; flex-wrap: wrap; gap: 6px; }
.imports label { display: inline-flex; gap: 6px; align-items: center; border: 1.5px solid var(--line); border-radius: 9px; padding: 4px 9px; font: 600 13px var(--mono); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.card { text-align: left; border: 1.5px solid var(--line); border-radius: 15px; background: var(--panel2); padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.card:hover { border-color: var(--accent); }
.card .em { font-size: 26px; line-height: 1; }
.card b { font-size: 15.5px; font-weight: 900; line-height: 1.3; }
.card span { color: var(--muted); font-size: 13.5px; }
.card small { font: 600 11.5px var(--mono); color: var(--muted); margin-top: auto; padding-top: 4px; }
.pickHead { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.pickHead input { flex: 1 1 240px; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--panel2); font-weight: 700; }
.pickHead select { padding: 9px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--panel2); font-weight: 700; max-width: 100%; }
.pickList { max-height: 55vh; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
.pick { text-align: left; border: 1.5px solid var(--line); background: var(--panel); border-radius: 11px; padding: 9px 11px; }
.pick:hover { border-color: var(--accent); background: var(--panel2); }
.pick .bl { display: block; font-size: 13px; color: var(--muted); }
.pick .gname { font-size: 11.5px; font-weight: 800; color: var(--muted); margin-left: 8px; }
/* pastilles dans les blocs : variables (orange, comme Scratch), fonctions, fonctions de GIMP, attributs */
.gcbPill > rect.blocklyFieldRect { stroke-width: 1.5px; fill-opacity: 1; }
.gcbPill > text.blocklyText { font-weight: 800 !important; }
.gcbPill-var > rect.blocklyFieldRect { fill: #FF8C1A !important; stroke: #D96F00 !important; }
.gcbPill-var > text.blocklyText, .gcbPill-func > text.blocklyText, .gcbPill-attr > text.blocklyText { fill: #fff !important; }
.gcbPill-func > rect.blocklyFieldRect { fill: #0A5F57 !important; stroke: rgba(0, 0, 0, .25) !important; }
.gcbPill-func.gcbPill-pdb > rect.blocklyFieldRect { fill: #FFD23F !important; stroke: #C99700 !important; }
.gcbPill-func.gcbPill-pdb > text.blocklyText { fill: #3B2E00 !important; }
.gcbPill-attr > rect.blocklyFieldRect { fill: #2F6B3A !important; stroke: rgba(0, 0, 0, .25) !important; }
.gcbPill-solo > rect.blocklyFieldRect { fill: transparent !important; stroke: none !important; }
/* liste de suggestions sous une case */
.sgBox { position: fixed; z-index: 100001; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: auto; padding: 6px; font-family: var(--font); font-size: 13px; }
.sgHead { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 800; color: var(--muted); padding: 2px 6px 6px; position: sticky; top: -6px; background: var(--panel); }
.sgAll { border: 1.5px solid var(--line); background: var(--panel2); border-radius: 8px; padding: 2px 8px; font-weight: 800; font-size: 11.5px; color: var(--ink); cursor: pointer; white-space: nowrap; }
.sgAll:hover { border-color: var(--accent); }
.sgRow { padding: 6px 8px; border-radius: 9px; cursor: pointer; }
.sgRow.on { background: var(--accent-soft); }
.sgNone { padding: 8px; color: var(--muted); }
.sgChip { display: inline-block; padding: 2px 11px; border-radius: 999px; color: #fff; font: 800 12.5px var(--mono); background: #414B60; word-break: break-all; }
.sg-var { background: #FF8C1A; } .sg-const { background: #8E5CC7; } .sg-fn { background: #0A5F57; } .sg-def { background: #3776AB; } .sg-attr { background: #2F6B3A; }
.sgSub { font: 11.5px var(--mono); color: var(--muted); margin-left: 6px; word-break: break-word; }
.sgDesc { font-size: 12.5px; color: var(--muted); margin-top: 2px; line-height: 1.35; }
.pick .ar { display: block; font: 12px var(--mono); color: var(--muted); margin-top: 2px; word-break: break-word; }
.status { border-radius: 13px; padding: 12px 14px; font-weight: 800; margin-bottom: 14px; }
.status.ok { background: var(--ok-soft); } .status.warn { background: var(--warn-soft); } .status.err { background: var(--err-soft); }
.path { font: 600 12.5px var(--mono); background: var(--code-bg); border: 1px solid var(--line); border-radius: 7px; padding: 1px 6px; word-break: break-all; }
.dlrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
textarea.copyzone { width: 100%; min-height: 220px; font: 12px var(--mono); border-radius: 10px; border: 1px solid var(--line); background: var(--code-bg); padding: 10px; }
.hero { display: grid; grid-template-columns: 1.15fr .85fr; gap: 22px; align-items: center; }
.hero h2 { font-size: 27px; line-height: 1.15; }
.stack { display: flex; flex-direction: column; transform: rotate(-2.5deg); }
.pb { color: #fff; font-weight: 900; font-size: 14px; padding: 10px 14px; border-radius: 9px; position: relative; width: fit-content; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .18); }
.pb.hat { border-radius: 22px 22px 9px 9px; padding-top: 16px; }
.pb.in { margin-left: 22px; }
.pb + .pb { margin-top: -1px; }
#toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--panel); padding: 11px 18px; border-radius: 12px; font-weight: 800; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 99; max-width: 90vw; }
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
#sideToggle { display: none; }

/* barre de menus façon Notepad++ */

#findBar button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 9px; font-weight: 800; font-size: 12.5px; }

.tourCard { position: fixed; width: min(380px, calc(100vw - 24px)); background: var(--panel); border-radius: 16px; box-shadow: 0 20px 60px rgba(0, 0, 0, .4); padding: 16px 18px 12px; }

.aiMsg.bot { background: var(--panel2); border: 1px solid var(--line); }
.aiMsg .st { font-weight: 800; margin-bottom: 6px; }

/* apparence */
.presetRow { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-bottom: 14px; }
.preset.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }

.swatch { display: flex; gap: 8px; align-items: center; font-weight: 700; font-size: 13px; }
.swatch input { width: 36px; height: 28px; border: 0; background: none; padding: 0; }
input[type=range] { width: 100%; accent-color: var(--accent); }
table.keys { border-collapse: collapse; width: 100%; font-size: 14px; }
table.keys td { padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.keys kbd { font: 700 12px var(--mono); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; white-space: nowrap; }
@media (max-width: 1350px) { .brand h1 { display: none; } }

GA.SPEC = {};
function primitiveShadow(sh, val) {
  var s = JSON.parse(JSON.stringify(sh));
  s.fields = s.fields || {};

  else if (s.type === 'g_text' || s.type === 'g_value') s.fields.TEXT = String(val);
  else if (s.type === 'op_bool') s.fields.V = val ? 'TRUE' : 'FALSE';
  else if (s.type === 'colour_picker') s.fields.COLOUR = String(val);
  return s;
}
function primitiveBlock(val) {
  if (typeof val === 'number') return { type: 'math_number', fields: { NUM: val } };
  if (typeof val === 'boolean') return { type: 'op_bool', fields: { V: val ? 'TRUE' : 'FALSE' } };
  return { type: 'g_text', fields: { TEXT: String(val) } };
}
function expandShadow(sh) {
  var st = GA.blockState(sh.type, sh.fields, null, true);
  if (sh.inputs) {
    st.inputs = st.inputs || {};
    for (var k in sh.inputs) st.inputs[k] = sh.inputs[k];
  }
  return st;
}
function chain(list) {
  var first = null, prev = null;
  list.forEach(function (b) {
    if (!b) return;
    var copy = b;
    if (!first) first = copy;
    else prev.next = { block: copy };
    prev = copy;
  });
  return first;
}

GA.blockState = function (type, fields, inputs, asShadow, extra) {
  var spec = GA.SPEC[type];
  var st = { type: type };
  if (fields) {
    st.fields = {};
    for (var f in fields) {
      var a = spec && spec.args[f];
      if (a && a.k === 'var') st.fields[f] = { name: fields[f] };
      else st.fields[f] = fields[f];
    }
  }
  var ins = {};
  var has = false;
  if (spec) {
    for (var k in spec.args) {
      var arg = spec.args[k];
      var given = inputs ? inputs[k] : undefined;
      if (arg.k === 'v') {
        var sh = arg.sh ? expandShadow(arg.sh) : null;
        if (given !== undefined && given !== null && typeof given === 'object') {
          ins[k] = { block: given };
          if (sh) ins[k].shadow = sh;
          has = true;
        } else if (given !== undefined && given !== null) {
          if (sh) { ins[k] = { shadow: primitiveShadow(arg.sh.type ? expandShadow(arg.sh) : sh, given) }; }
          else ins[k] = { block: primitiveBlock(given) };
          has = true;
        } else if (sh) { ins[k] = { shadow: sh }; has = true; }

    for (var k2 in inputs) { ins[k2] = inputs[k2]; has = true; }
  }
  if (has) st.inputs = ins;
  if (extra) for (var e in extra) st[e] = extra[e];
  return st;
};

/* ---------- JSON Blockly à partir d'une spécification ---------- */
function argJson(name, a) {
  switch (a.k) {
    case 'v': return a.check ? { type: 'input_value', name: name, check: a.check } : { type: 'input_value', name: name };
    case 'st': return { type: 'input_statement', name: name, check: a.check };
    case 'dd': return { type: 'field_dropdown', name: name, options: a.options };
    case 'cb': return { type: 'field_checkbox', name: name, checked: a.value };
    case 'var': return { type: 'field_variable', name: name, variable: a.name };
    case 'text': return { type: 'field_input', name: name, text: a.value };
    case 'num': return { type: 'field_number', name: name, value: a.value, min: a.min, max: a.max, precision: a.precision };
    case 'col': return { type: 'field_colour', name: name, colour: a.value };
    case 'lbl': return { type: 'field_label_serializable', name: name, text: a.value };
  }
  throw new Error('type d\'argument inconnu ' + a.k);
}
GA.specToJson = function (spec) {
  var parts = spec.msg.split(/(%[A-Z][A-Z0-9_]*)/);
  var message = '', args = [], n = 0;
  parts.forEach(function (t) {
    var m = t.match(/^%([A-Z][A-Z0-9_]*)$/);
    if (!m) { message += t.replace(/%/g, '%%'); return; }
    n++;
    message += '%' + n;
    if (m[1] === 'BR') { args.push({ type: 'input_end_row' }); return; }
    var a = spec.args[m[1]];
    if (!a) throw new Error('argument manquant ' + m[1] + ' dans ' + spec.type);
    args.push(argJson(m[1], a));
  });
  var json = { type: spec.type, message0: message.trim(), args0: args, style: 'cat_' + spec.cat, tooltip: spec.help,
    inputsInline: spec.inline !== false };
  if (spec.out !== undefined) json.output = spec.out;
  else if (spec.kind === 'setting') { json.previousStatement = 'Setting'; json.nextStatement = 'Setting'; }
  else if (spec.kind !== 'hat') { json.previousStatement = 'Action'; if (!spec.cap) json.nextStatement = 'Action'; }
  return json;

'Bienvenue dans l\'Atelier 👋': 'Welcome to the Workshop 👋',
'Ici, tu crées des <b>plug-ins pour GIMP 2.10</b> (des commandes qui s\'ajoutent aux menus de GIMP) en emboîtant des blocs. L\'atelier écrit le vrai code Python à ta place.<br><br>Ce tutoriel dure 2 minutes. Tu peux le relancer avec <b>Aide ▸ Tutoriel</b> ou <b>F1</b>.': 'Here you create <b>plug-ins for GIMP 2.10</b> (commands added to GIMP\'s menus) by snapping blocks together. The workshop writes the real Python code for you.<br><br>This tutorial takes 2 minutes. You can run it again with <b>Help ▸ Tutorial</b> or <b>F1</b>.',
'Dans quoi tu t\'embarques': 'What you are getting into',
'<b>Il te faut GIMP 2.10</b> avec Python (l\'installeur Windows l\'inclut). GIMP 3 utilise un autre système : les plug-ins de l\'atelier ne marchent pas dans GIMP 3.<br><br>Un plug-in est un vrai programme : <b>essaie-le d\'abord sur une copie</b> de tes images. L\'atelier vérifie énormément de choses (fonctions de GIMP, cases vides, syntaxe…), mais seul GIMP exécute vraiment le plug-in.': '<b>You need GIMP 2.10</b> with Python (the Windows installer includes it). GIMP 3 uses another system: the workshop\'s plug-ins do not work in GIMP 3.<br><br>A plug-in is a real program: <b>try it on a copy first</b> of your images. The workshop checks a great many things (GIMP functions, empty slots, syntax…), but only GIMP really runs the plug-in.',
'Les catégories de blocs': 'The block categories',
'Chaque couleur est une famille : calques, sélection, texte, fichiers… Clique une catégorie, puis glisse un bloc dans la zone de travail. La catégorie <b>🐍 Python</b> contient les blocs des scripts importés.': 'Each colour is a family: layers, selection, text, files… Click a category, then drag a block into the workspace. The <b>🐍 Python</b> category holds the blocks of imported scripts.',
'Le bloc de départ': 'The starting block',
'Tout part d\'ici : le nom de ton plug-in dans le menu de GIMP, les réglages demandés à l\'utilisateur (<i>d\'abord, demander</i>) et les actions (<i>puis faire</i>), exécutées de haut en bas.': 'Everything starts here: the name of your plug-in in GIMP\'s menu, the settings asked of the user (<i>first, ask</i>) and the actions (<i>then do</i>), run from top to bottom.',
'L\'aide qui explique tout': 'The help that explains everything',
'Clique sur n\'importe quel bloc : son rôle, le code Python qu\'il produit et les fonctions de GIMP qu\'il utilise s\'affichent ici.': 'Click any block: what it does, the Python code it produces and the GIMP functions it uses appear here.',
'Le vrai code': 'The real code',
'L\'onglet Code montre le fichier Python complet. Clique une ligne : son bloc est sélectionné. Clique un bloc : ses lignes s\'allument.': 'The Code tab shows the complete Python file. Click a line: its block is selected. Click a block: its lines light up.',
'La vérification': 'The check',
'Si quelque chose cloche (case vide, bloc isolé, fonction inconnue…), c\'est signalé ici en français, avec un lien vers le bloc concerné.': 'If something is wrong (empty slot, stray block, unknown function…), it is reported here in plain words, with a link to the block concerned.',
'Les menus, comme dans Notepad++': 'The menus, like in Notepad++',
'<b>Fichier</b> : ouvrir, importer un script Python existant (il devient des blocs, et redevient exactement le même fichier). <b>Édition</b> : sélection multiple (Ctrl + clic), copier-coller. <b>Recherche</b> : Ctrl+F. <b>Affichage</b> : tout déplier (Alt+Maj+0). <b>Paramètres</b> : apparence, langue.': '<b>File</b>: open, import an existing Python script (it becomes blocks, and becomes exactly the same file again). <b>Edit</b>: multiple selection (Ctrl + click), copy and paste. <b>Search</b>: Ctrl+F. <b>View</b>: unfold everything (Alt+Shift+0). <b>Settings</b>: look and feel, language.',
'L\'IA qui écrit pour toi': 'The AI that writes for you',
'Décris ce que tu veux (« une fonction qui renomme tous les calques texte… ») : l\'IA écrit le code, l\'atelier le vérifie (fonctions de GIMP 2.10, nombre d\'arguments, règles Python 2.7) puis le transforme en blocs.': 'Describe what you want ("a function that renames every text layer…"): the AI writes the code, the workshop checks it (GIMP 2.10 functions, argument counts, Python 2.7 rules) then turns it into blocks.',
'Installer ton plug-in': 'Installing your plug-in',
'Télécharge le .zip, copie le fichier .py dans <b>C:\\Users\\TON_NOM\\AppData\\Roaming\\GIMP\\2.10\\plug-ins</b>, puis redémarre GIMP. Ton plug-in apparaît dans le menu choisi.': 'Download the .zip, copy the .py file into <b>C:\\Users\\YOUR_NAME\\AppData\\Roaming\\GIMP\\2.10\\plug-ins</b>, then restart GIMP. Your plug-in appears in the chosen menu.',
'À toi de jouer ! 🎨': 'Over to you! 🎨',
'Commence par un exemple (<b>Fichier ▸ Exemples</b>) et modifie-le, ou importe un de tes scripts. Ton travail est enregistré automatiquement dans ce navigateur ; pense à <b>Fichier ▸ Sauvegarder le projet</b> pour le garder ailleurs.': 'Start from an example (<b>File ▸ Examples</b>) and change it, or import one of your scripts. Your work is saved automatically in this browser; use <b>File ▸ Save the project</b> to keep it elsewhere.',

  while (i < n) {
    var c = text[i];
    if (c === '#') { var e = text.indexOf('\n', i); if (e < 0) e = n; out += text.slice(i, e); i = e; continue; }
    if (c === '"' || c === "'") {
      var triple = text.substr(i, 3) === c + c + c, j = i + (triple ? 3 : 1);
      while (j < n) {
        if (text[j] === '\\') { j += 2; continue; }
        if (triple ? text.substr(j, 3) === c + c + c : text[j] === c) { j += triple ? 3 : 1; break; }
        if (!triple && text[j] === '\n') break;
        j++;
      }
      out += text.slice(i, j).replace(/\n/g, NL); i = j; continue;
    }
    out += c; i++;
  }
  return out;
};

/* empreinte structurelle (pour vérifier qu'un aller-retour ne perd rien) */
PY.dump = function (node) {
  return JSON.stringify(node, function (k, v) {
    if (/^(blank|inline|paren|elif|line|ml|tc|src|gap|bl|ind|t|ic|sl|meta|elseMeta|finMeta|decoMeta|kwInd|fmt|sc)$/.test(k)) return undefined;
    return v;
  });
};
PY.comments = function (mod) {
  var out = [];
  (function walk(x) {
    if (Array.isArray(x)) { x.forEach(walk); return; }
    if (!x || typeof x !== 'object') return;
    if (x.type === 'Comment') out.push(x.text);
    if (typeof x.inline === 'string') out.push(x.inline);
    if (x.ic) x.ic.forEach(function (c) { out.push(c); });
    for (var k in x) if (k !== 'ic' && x[k] && typeof x[k] === 'object') walk(x[k]);
  })(mod.body);
  return out;
};

    sp('py_raw', '🧱 code brut', 'Du code gardé caractère pour caractère, parce qu\'il contient une erreur de syntaxe (déjà présente dans le fichier d\'origine). Corrige-le puis réimporte le script pour le transformer en blocs.', { type: 'py_raw', fields: { CODE: '# code brut' } }),
    sp('py_var', 'variable', 'Une variable : un nom qui garde une valeur (image, calque, nombre, texte…). Clique dessus pour choisir parmi les variables de ton script.', { type: 'py_var', fields: { NAME: 'image' } }, { sep: 'Valeurs', kw: 'variable nom' }),

    sp('py_compare', '… == …', 'Une comparaison (==, !=, <, >, dans, est…).', { type: 'py_compare', extraState: { n: 1 }, fields: { OP1: '==' }, inputs: { V0: leafBox('x'), V1: leafBox('0') } }),

    sp('py_list', '[ …, … ]', 'Une liste ou un tuple de valeurs. Clic droit pour ajouter des éléments.', { type: 'py_list', extraState: { k: 'list', n: 2 } }),
    sp('py_paren', '( … )', 'Des parenthèses autour d\'une valeur, comme dans ton code d\'origine.', null),

/* ---------- définitions Blockly + générateurs ---------- */
GA.pyInit = function (Blockly, G) {
  var leafOrdCache = new Map();
  function leafOrd(text) {
    if (leafOrdCache.has(text)) return leafOrdCache.get(text);
    var o;
    try { o = PY.ordOf(PY.prec(PY.parseExpr(text, true))); } catch (e) { o = 99; }
    if (leafOrdCache.size > 20000) leafOrdCache.clear();
    leafOrdCache.set(text, o);
    return o;
  }
  GA.leafOrd = leafOrd;
  function tx(s) { return PY.markStrings(String(s == null ? '' : s)); }
  /* Mise en forme exacte. Chaque ligne d'instruction porte un repère \u0001 + genre + indentation d'origine + \u0002
     (genre S = instruction, H = clause else/elif/except/finally, C = commentaire), résolu à l'assemblage du fichier. */
  var FM = ['sp', 'bl', 'i', 't', 'g', 'o', 'oh', 'ic', 'sl', 'sc'];
  var SIMPLE = { py_assign: 1, py_augassign: 1, py_callst: 1, py_return: 1, py_raise: 1, py_pass: 1, py_break: 1, py_continue: 1, py_exprstmt: 1, py_stmt: 1 };
  function hint(k, i) { return '\u0001' + k + (i === undefined || i === null ? '\u0005' : i) + '\u0002'; }
  function blk(m) { if (m.bl) return m.bl.map(function (x) { return '\u0000' + x + '\n'; }).join(''); return new Array((m.sp || 0) + 1).join('\n'); }
  function endOf(m, c) { if (c !== null && c !== undefined) return (m.g !== undefined ? m.g : '  ') + '#' + String(c).replace(/[\r\n]+/g, ' '); return m.t || ''; }
  function pickM(m, norm) { if (m.o !== undefined && m.oh === PY.fnv(PY.clean(norm))) return { txt: m.o.replace(/\n/g, '\n\u0000'), orig: true }; return { txt: norm, orig: false }; }
  function icLines(m, orig) { if (orig || !m.ic) return ''; return m.ic.map(function (c) { return hint('C', m.i) + '#' + c + '\n'; }).join(''); }
  function com(b) { return b.getCommentText ? b.getCommentText() : null; }
  // « a = 1; b = 2 » : la 2e instruction se recolle à la précédente si celle-ci est une instruction simple sans commentaire
  function joinable(b) {
    var m = b.fm_, pv = b.getPreviousBlock();
    if (m.sc === undefined || !pv || pv.getNextBlock() !== b || !SIMPLE[pv.type] || !pv.isEnabled()) return false;
    if (com(pv) !== null && com(pv) !== undefined) return false;
    if (pv.fm_ && pv.fm_.t) return false;
    return !m.bl && !m.sp;
  }
  function stmtLine(b, norm) {
    var m = b.fm_, p = pickM(m, norm);
    if (joinable(b)) return '\u0006' + m.sc + '\u0007' + p.txt + endOf(m, com(b)) + '\n';
    return blk(m) + icLines(m, p.orig) + hint('S', m.i) + p.txt + endOf(m, com(b)) + '\n';
  }
  function sameLine(b, name, sl, c) {
    if (sl === undefined || sl === null || (c !== null && c !== undefined)) return null;
    var ch = b.getInputTargetBlock(name);
    if (!ch || ch.getNextBlock() || !SIMPLE[ch.type] || !ch.isEnabled()) return null;
    var code = G.blockToCode(ch);
    code = code.replace(/^[ \t]*#@@'[^\n]*'\n/, '').replace(/\u0001[^\u0002]*\u0002/g, '');
    if (code.charAt(0) === '\n' || code.charAt(0) === '\u0000') return null;
    code = code.replace(/\n$/, '');
    if (/\n(?!\u0000)/.test(code)) return null;
    return sl + code;
  }
  function headLine(b, norm, bodyName) {
    var m = b.fm_, p = pickM(m, norm), c = com(b);
    var same = sameLine(b, bodyName, m.sl, c);
    if (same !== null) return blk(m) + icLines(m, p.orig) + hint('S', m.i) + p.txt + same + '\n';
    return blk(m) + icLines(m, p.orig) + hint('S', m.i) + p.txt + endOf(m, c) + '\n' + body(b, bodyName);
  }
  function clauseLine(b, key, norm, bodyName) {
    var m = (b.cm_ && b.cm_[key]) || {}, p = pickM(m, norm);
    var same = sameLine(b, bodyName, m.sl, m.c);
    if (same !== null) return blk(m) + hint('H', m.i) + p.txt + same + '\n';
    return blk(m) + icLines(m, p.orig) + hint('H', m.i) + p.txt + endOf(m, m.c) + '\n' + body(b, bodyName);
  }
  function val(b, name, p) { var c = G.valueToCode(b, name, p ? PY.need(p) : 99); return c || 'None'; }
  function has(b, name) { return !!b.getInputTargetBlock(name); }
  function body(b, name) {
    var code = G.statementToCode(b, name) || '';
    var t = b.getInputTargetBlock(name), ok = false;
    while (t) { if (t.type !== 'py_comment' && t.isEnabled()) { ok = true; break; } t = t.getNextBlock(); }
    if (!ok) code += IND + hint('S') + 'pass\n';
    return code;
  }
  function txt(v) { return new Blockly.FieldTextInput(v); }
  /* champ « pastille » : variable, fonction ou attribut, avec suggestions pendant la frappe (GA.suggest) */
  class PillField extends Blockly.FieldTextInput {
    constructor(v, kind) { super(v); this.kind_ = kind; }
    initView() {
      super.initView();
      if (!this.fieldGroup_) return;
      Blockly.utils.dom.addClass(this.fieldGroup_, 'gcbPill gcbPill-' + this.kind_);
      var src = this.getSourceBlock();
      if (src && src.type === 'py_var') Blockly.utils.dom.addClass(this.fieldGroup_, 'gcbPill-solo');   // le bloc entier est la pastille
      if (this.kind_ === 'func' && /^pdb\./.test(this.getValue() || '')) Blockly.utils.dom.addClass(this.fieldGroup_, 'gcbPill-pdb');
    }
    isFullBlockField() { return false; }   // sinon Zelos repeint tout le bloc en blanc
    render_() {
      super.render_();
      var r = this.borderRect_;
      if (r) { var h = this.size_.height; r.setAttribute('rx', h / 2); r.setAttribute('ry', h / 2); }
    }
    showEditor_(e, quiet) {
      super.showEditor_(e, quiet);
      if (GA.suggest && this.htmlInput_) GA.suggest.open(this, this.kind_, this.htmlInput_);
    }
  }
  function pill(v, kind) { return new PillField(v, kind); }
  GA.PillField = PillField;
  function mtxt(v) { return new Blockly.FieldMultilineInput(v); }
  function mutate(block, fn) {
    var before = JSON.stringify(block.saveExtraState() || {});
    Blockly.Events.setGroup(true);
    try {
      fn();
      var after = JSON.stringify(block.saveExtraState() || {});
      if (block.rendered) { try { block.initSvg(); } catch (e) { /* ok */ } if (block.queueRender) block.queueRender(); else block.render(); }
      var BC = Blockly.Events.BlockChange || Blockly.Events.get(Blockly.Events.BLOCK_CHANGE);
      Blockly.Events.fire(new BC(block, 'mutation', null, before, after));
    } finally { Blockly.Events.setGroup(false); }
  }
  function rm(block, name) { if (block.getInput(name)) block.removeInput(name); }
  function item(text, fn, enabled) { return { text: text, enabled: enabled !== false, callback: fn }; }

  /* instruction : bloc avec lignes vides avant (sp) et commentaire de fin de ligne (icône) */
  function defStmt(type, o) {
    Blockly.Blocks[type] = {
      init: function () {
        this.fm_ = {}; this.cm_ = null;
        o.init.call(this);
        this.setPreviousStatement(true, 'Action'); this.setNextStatement(true, 'Action');
        this.setStyle(o.style || 'cat_py');
        this.setTooltip(GA.SPEC[type] ? GA.SPEC[type].help : '');
      },
      saveExtraState: function () {
        var st = o.save ? o.save.call(this) : {}, fm = this.fm_ || {};
        FM.forEach(function (k) { if (fm[k] !== undefined) st[k] = fm[k]; });
        if (this.cm_) st.cm = this.cm_;
        return Object.keys(st).length ? st : null;
      },
      loadExtraState: function (st) {
        st = st || {}; var fm = this.fm_ = {};
        FM.forEach(function (k) { if (st[k] !== undefined) fm[k] = st[k]; });
        this.cm_ = st.cm || null;
        if (o.load) o.load.call(this, st);
      },
      customContextMenu: o.menu ? function (opts) { o.menu.call(this, opts); } : undefined
    };
    G.forBlock[type] = function (b) { return o.gen.call(b, b); };
  }
  function defVal(type, o) {
    var def = {
      init: function () { o.init.call(this); this.setOutput(true, null); this.setStyle(o.style || 'cat_pyexpr'); this.setInputsInline(true); this.setTooltip(GA.SPEC[type] ? GA.SPEC[type].help : ''); }
    };
    if (o.save) { def.saveExtraState = function () { return o.save.call(this); }; def.loadExtraState = function (st) { o.load.call(this, st || {}); }; }
    if (o.menu) def.customContextMenu = function (opts) { o.menu.call(this, opts); };
    Blockly.Blocks[type] = def;
    G.forBlock[type] = function (b) { return o.gen.call(b, b); };
  }

  /* ----- fichier ----- */
  Blockly.Blocks.py_file = {
    init: function () {
      this.py3_ = false;
      this.appendDummyInput().appendField(T('📄 script Python')).appendField(txt('mon_script'), 'NAME').appendField(T('.py'));
      this.appendStatementInput('DO').setCheck('Action');
      this.setStyle('cat_py'); this.setDeletable(false);
      this.setTooltip(GA.SPEC.py_file.help);
    },
    saveExtraState: function () {
      var s = {};
      if (this.py3_) s.py3 = true;
      if (this.bom_) s.bom = 1;
      if (this.eol_) s.eol = this.eol_;
      if (this.end_ !== undefined) s.end = this.end_;
      return Object.keys(s).length ? s : null;
    },
    loadExtraState: function (s) { s = s || {}; this.py3_ = !!s.py3; this.bom_ = !!s.bom; this.eol_ = s.eol || null; this.end_ = s.end; }
  };

  /* ----- instructions simples ----- */
  defStmt('py_comment', { style: 'cat_pycom', init: function () { this.appendDummyInput().appendField('#').appendField(txt(' commentaire'), 'TEXT'); },
    gen: function (b) { return blk(b.fm_) + hint('C', b.fm_.i) + '#' + String(b.getFieldValue('TEXT')).replace(/[\r\n]+/g, ' ') + '\n'; } });
  defStmt('py_raw', { style: 'cat_pyraw', init: function () { this.appendDummyInput().appendField(T('🧱 code brut (erreur de syntaxe à corriger)')); this.appendDummyInput('B').appendField(mtxt(''), 'CODE'); },
    gen: function (b) { return blk(b.fm_) + '\u0000' + String(b.getFieldValue('CODE')).replace(/\n/g, '\n\u0000') + '\n'; } });
  defStmt('py_stmt', { init: function () { this.appendDummyInput().appendField(mtxt('pass'), 'CODE'); },
    gen: function (b) { return stmtLine(b, tx(b.getFieldValue('CODE'))); } });
  defStmt('py_decorator', { init: function () { this.appendDummyInput().appendField('@').appendField(txt('decorateur'), 'CODE'); },
    gen: function (b) { return stmtLine(b, '@' + tx(b.getFieldValue('CODE'))); } });
  defStmt('py_pass', { init: function () { this.appendDummyInput().appendField(T('ne rien faire (pass)')); }, gen: function (b) { return stmtLine(b, 'pass'); } });
  defStmt('py_break', { init: function () { this.appendDummyInput().appendField(T('sortir de la boucle (break)')); }, gen: function (b) { return stmtLine(b, 'break'); } });
  defStmt('py_continue', { init: function () { this.appendDummyInput().appendField(T('tour suivant (continue)')); }, gen: function (b) { return stmtLine(b, 'continue'); } });
  defStmt('py_return', { init: function () { this.appendValueInput('V').appendField(T('retourner')); },
    gen: function (b) { return stmtLine(b, 'return' + (has(b, 'V') ? ' ' + val(b, 'V', 0) : '')); } });
  defStmt('py_raise', { init: function () { this.appendValueInput('V').appendField(T('lever l\'erreur')); },
    gen: function (b) { return stmtLine(b, 'raise' + (has(b, 'V') ? ' ' + val(b, 'V', 1) : '')); } });
  defStmt('py_assign', { init: function () { this.appendValueInput('V').appendField(pill('x', 'var'), 'T').appendField('='); this.setInputsInline(true); },
    gen: function (b) { return stmtLine(b, tx(b.getFieldValue('T')) + ' = ' + val(b, 'V', 0)); } });
  var AUGS = ['+=', '-=', '*=', '/=', '//=', '%=', '**=', '>>=', '<<=', '&=', '|=', '^=', '@='];
  defStmt('py_augassign', { init: function () { this.appendValueInput('V').appendField(pill('x', 'var'), 'T').appendField(new Blockly.FieldDropdown(AUGS.map(function (o) { return [o, o]; })), 'OP'); this.setInputsInline(true); },
    gen: function (b) { return stmtLine(b, tx(b.getFieldValue('T')) + ' ' + b.getFieldValue('OP') + ' ' + val(b, 'V', 0)); } });
  defStmt('py_exprstmt', { init: function () { this.appendValueInput('V').appendField('▸'); },
    gen: function (b) { return stmtLine(b, has(b, 'V') ? val(b, 'V', 0) : 'pass'); } });

  /* ----- définitions ----- */
  defStmt('py_def', {
    init: function () {
      this.ret_ = null;
      this.appendDummyInput('HEAD').appendField(T('définir')).appendField(txt('ma_fonction'), 'NAME').appendField('(').appendField(txt(''), 'ARGS').appendField(')');
      this.appendStatementInput('DO').setCheck('Action');
    },
    save: function () { return this.ret_ !== null ? { ret: this.ret_ } : {}; },
    load: function (st) {
      this.ret_ = st.ret === undefined ? null : st.ret;
      if (this.getField('RET')) this.getInput('HEAD').removeField('RET');
      if (this.ret_ !== null) this.getInput('HEAD').appendField('→ ' + this.ret_, 'RET');
    },
    gen: function (b) {
      return headLine(b, 'def ' + b.getFieldValue('NAME') + '(' + tx(b.getFieldValue('ARGS')) + ')' + (b.ret_ !== null ? ' -> ' + tx(b.ret_) : '') + ':', 'DO');
    }
  });
  defStmt('py_class', {
    init: function () {
      this.appendDummyInput().appendField(T('classe')).appendField(txt('MaClasse'), 'NAME').appendField('(').appendField(txt(''), 'BASES').appendField(')');
      this.appendStatementInput('DO').setCheck('Action');
    },
    gen: function (b) { var bs = String(b.getFieldValue('BASES')).trim(); return headLine(b, 'class ' + b.getFieldValue('NAME') + (bs ? '(' + tx(bs) + ')' : '') + ':', 'DO'); }
  });

  /* ----- si / sinon si / sinon ----- */
  defStmt('py_if', {
    init: function () { this.n_ = 0; this.e_ = false; this.appendValueInput('C0').appendField(T('si')); this.appendStatementInput('DO0').setCheck('Action').appendField(T('alors')); },
    save: function () { var s = {}; if (this.n_) s.n = this.n_; if (this.e_) s.e = true; return s; },
    load: function (st) { this.setShape_(st.n || 0, !!st.e); },
    menu: function (opts) {
      var b = this;
      opts.push(item('➕ Ajouter « sinon si »', function () { mutate(b, function () { b.setShape_(b.n_ + 1, b.e_); }); }));
      if (!b.e_) opts.push(item('➕ Ajouter « sinon »', function () { mutate(b, function () { b.setShape_(b.n_, true); }); }));
      if (b.n_) opts.push(item('➖ Retirer le dernier « sinon si »', function () { mutate(b, function () { b.setShape_(b.n_ - 1, b.e_); }); }));
      if (b.e_) opts.push(item('➖ Retirer « sinon »', function () { mutate(b, function () { b.setShape_(b.n_, false); }); }));
    },
    gen: function (b) {
      var code = headLine(b, 'if ' + val(b, 'C0', 0) + ':', 'DO0');
      for (var i = 1; i <= b.n_; i++) code += clauseLine(b, 'e' + i, 'elif ' + val(b, 'C' + i, 0) + ':', 'DO' + i);
      if (b.e_) code += clauseLine(b, 'el', 'else:', 'ELSE');
      return code;
    }
  });
  Blockly.Blocks.py_if.setShape_ = function (n, e) {
    var i;
    for (i = n + 1; this.getInput('C' + i); i++) { rm(this, 'C' + i); rm(this, 'DO' + i); }
    if (!e) rm(this, 'ELSE');
    for (i = 1; i <= n; i++) {
      if (!this.getInput('C' + i)) {
        this.appendValueInput('C' + i).appendField(T('sinon si'));
        this.appendStatementInput('DO' + i).setCheck('Action').appendField(T('alors'));
        if (this.getInput('ELSE')) { this.moveInputBefore('C' + i, 'ELSE'); this.moveInputBefore('DO' + i, 'ELSE'); }
      }
    }
    if (e && !this.getInput('ELSE')) this.appendStatementInput('ELSE').setCheck('Action').appendField(T('sinon'));
    this.n_ = n; this.e_ = e;
  };

  /* ----- boucles ----- */
  function elseShape(b, e) { if (e && !b.getInput('ELSE')) b.appendStatementInput('ELSE').setCheck('Action').appendField(T('sinon (boucle finie)')); if (!e) rm(b, 'ELSE'); b.e_ = e; }
  function elseMenu(opts) { var b = this; opts.push(item(b.e_ ? '➖ Retirer « sinon »' : '➕ Ajouter « sinon » (rare)', function () { mutate(b, function () { elseShape(b, !b.e_); }); })); }
  defStmt('py_for', {
    init: function () { this.e_ = false; this.appendValueInput('ITER').appendField(T('pour')).appendField(pill('x', 'var'), 'T').appendField(T('dans')); this.appendStatementInput('DO').setCheck('Action').appendField(T('faire')); },
    save: function () { return this.e_ ? { e: true } : {}; }, load: function (st) { elseShape(this, !!st.e); }, menu: elseMenu,
    gen: function (b) { return headLine(b, 'for ' + tx(b.getFieldValue('T')) + ' in ' + val(b, 'ITER', 0) + ':', 'DO') + (b.e_ ? clauseLine(b, 'el', 'else:', 'ELSE') : ''); }
  });
  defStmt('py_while', {
    init: function () { this.e_ = false; this.appendValueInput('C').appendField(T('tant que')); this.appendStatementInput('DO').setCheck('Action').appendField(T('faire')); },
    save: function () { return this.e_ ? { e: true } : {}; }, load: function (st) { elseShape(this, !!st.e); }, menu: elseMenu,
    gen: function (b) { return headLine(b, 'while ' + val(b, 'C', 0) + ':', 'DO') + (b.e_ ? clauseLine(b, 'el', 'else:', 'ELSE') : ''); }
  });

  /* ----- essayer ----- */
  defStmt('py_try', {
    init: function () { this.n_ = 0; this.e_ = false; this.f_ = false; this.appendStatementInput('DO').setCheck('Action').appendField(T('essayer')); this.setShape_(1, false, false); },
    save: function () { var s = { n: this.n_ }; if (this.e_) s.e = true; if (this.f_) s.f = true; return s; },
    load: function (st) { this.setShape_(st.n === undefined ? 1 : st.n, !!st.e, !!st.f); },
    menu: function (opts) {

  '<circle cx="10.5" cy="10.5" r="5" fill="none" stroke="#414B60" stroke-width="2.4"/>' +

GA.setup = function (Blockly, DATA) {

        toolboxBackgroundColour: dark ? '#1B1E31' : '#FFFFFF',
        toolboxForegroundColour: dark ? '#E6E8F5' : '#1E2140',
        flyoutBackgroundColour: dark ? '#23273E' : '#EDEFF8',
        flyoutForegroundColour: dark ? '#C9CDE6' : '#3A3F63',
        flyoutOpacity: 0.97,
        scrollbarColour: dark ? '#5A6090' : '#B7BCD6',
        scrollbarOpacity: 0.6,
        insertionMarkerColour: dark ? '#FFFFFF' : '#1E2140',
        insertionMarkerOpacity: 0.25,
        selectedGlowColour: '#FFC933',
        selectedGlowSize: 0.6,

  }

  GA.enumOptions = function (a) {

  };
  function definePdbBlock(Blockly, type, isValue) {

      help: isValue

        : 'Lance n\'importe laquelle des 857 fonctions de GIMP 2.10. Clique sur la loupe pour choisir : les cases à remplir apparaissent toutes seules.',

      init: function () {

          .appendField(new Blockly.FieldImage(SEARCH_SVG, 22, 22, 'choisir', function () { if (GA.onPickProc) GA.onPickProc(self); }))
          .appendField(new Blockly.FieldLabel(GA.T('choisir…')), 'PROC_LBL');
        if (isValue) this.setOutput(true, null);
        else { this.setPreviousStatement(true, 'Action'); this.setNextStatement(true, 'Action'); }
        this.setStyle('cat_adv');
        this.setInputsInline(false);
        this.setTooltip(GA.SPEC[type].help);
      },
      saveExtraState: function () { return this.proc_ ? { proc: this.proc_ } : null; },
      loadExtraState: function (s) { this.setProc((s && s.proc) || '', false); },
      setProc: function (py, withShadows) {

  }

  var TEXT_FUNCS = ['_texte(', '_lire_texte(', '_texte_du_calque(', '_joindre_chemin(', '_dossier_de(', '_nom_de_fichier(', '_sans_extension('];
  GA.returnsText = function (c) {
    var ok = TEXT_FUNCS.some(function (f) { return c.indexOf(f) === 0; });
    if (!ok || c.charAt(c.length - 1) !== ')') return false;
    var depth = 0, str = null;
    for (var i = c.indexOf('('); i < c.length; i++) {
      var ch = c.charAt(i);
      if (str) { if (ch === '\\') { i++; continue; } if (ch === str) str = null; continue; }

      if (ch === '(') depth++;

    v: function (b, name, order) { return G.valueToCode(b, name, order === undefined ? ORD.NONE : order); },
    obj: function (b, name, order) { return this.v(b, name, order) || 'None'; },
    num: function (b, name, order) { return this.v(b, name, order) || '0'; },
    int: function (b, name) {

    },
    bool: function (b, name, order) { return this.v(b, name, order) || 'False'; },
    col: function (b, name) { return this.v(b, name, ORD.NONE) || '(0, 0, 0)'; },
    txt: function (b, name) {

      if (GA.returnsText(c)) return c;

    list: function (b, name) { return this.v(b, name, ORD.NONE) || '[]'; },
    f: function (b, name) { return b.getFieldValue(name); },
    body: function (b, name) { return G.statementToCode(b, name) || G.INDENT + 'pass\n'; },
    need: function (h) {

    imp: function (m) { this.imports[m] = true; },
    uid: function (p) { this.uids[p] = (this.uids[p] || 0) + 1; return '_' + p + this.uids[p]; },
    reserveName: function (n) { this.usedNames[n] = true; },
    var: function (b, name) {

      var model = this.ws.getVariableById(id);
      var label = model ? model.name : String(id);
      if (this.varNames[id]) return this.varNames[id];
      var base = GA.pyIdent(label, 'variable');
      var n = base;
      if (GA.RESERVED[n] || this.usedNames[n]) {
        var i = 2;
        n = base + '_' + i;
        while (GA.RESERVED[n] || this.usedNames[n]) { i++; n = base + '_' + i; }

  });
  G.forBlock.math_number = function (b) {

  };
  G.forBlock.colour_picker = function (b) { return [GA.hexToTuple(b.getFieldValue('COLOUR')), ORD.ATOMIC]; };

    var sig = SIGS[b.proc_];

    var codes = [];
    sig[4].forEach(function (a, idx) {
      if (a[1] === 'count') { codes.push(null); return; }
      if (a[1] === 'enum' && ENUMS[a[5]]) { codes.push(b.getFieldValue('F' + idx) || '0'); return; }

        else if (a[1] === 'color') c = '(0, 0, 0)';
        else if (/array/.test(a[1])) c = '[]';
        else c = '0';

      }

    });
    for (var i = 0; i < codes.length; i++) if (codes[i] === null) codes[i] = 'len(' + (codes[i + 1] || '[]') + ')';

  /* ----- lecture du bloc de départ ----- */
  GA.getStart = function (ws) { return ws.getBlocksByType('g_start', false)[0] || null; };
  GA.getSettings = function (ws) {
    var out = [];
    var start = GA.getStart(ws);
    if (!start) return out;
    var b = start.getInputTargetBlock('SETTINGS');
    while (b) {
      if (b.isEnabled() && GA.SPEC[b.type] && GA.SPEC[b.type].kind === 'setting') {
        out.push({ block: b, spec: GA.SPEC[b.type], name: GA.pyIdent(b.getFieldValue('NAME'), 'reglage'), raw: b.getFieldValue('NAME') });
      }
      b = b.getNextBlock();
    }
    return out;
  };

  /* ----- assemblage du fichier Python ----- */
  GA.defaultOpts = function () {
    return { blurb: '', help: '', author: 'Moi', copyright: 'Moi', date: String(new Date().getFullYear()), procName: '',
      menuCustom: '<Image>/Filters/Mes scripts', undo: true, errors: true, context: true, flush: true, extraImports: [], crlf: true, keepBlocks: true };
  };
  GA.procNameFor = function (ws, opts) {
    var start = GA.getStart(ws);
    var label = start ? start.getFieldValue('LABEL') : 'mon script';
    var n = (opts.procName || '').trim();
    if (n) {
      n = GA.translit(n).replace(/[^A-Za-z0-9_-]+/g, '_');
      if (!/^(python[-_]|plug[-_]in[-_]|file[-_]|extension[-_])/.test(n)) n = 'python_fu_' + n;
      return n;
    }
    return 'python_fu_' + GA.pyIdent(label, 'mon_script').toLowerCase();
  };
  GA.menuFor = function (ws, opts) {
    var start = GA.getStart(ws);
    var m = start ? start.getFieldValue('MENU') : '<Image>/Filters/Mes scripts';
    if (m === 'CUSTOM') m = (opts.menuCustom || '<Image>/Filters/Mes scripts').trim();
    return m;
  };

  GA.buildPython = function (ws, opts) {

    var start = GA.getStart(ws);
    ctx.reset(ws);
    G.isInitialized = true;
    var label = start ? (start.getFieldValue('LABEL') || GA.L('Mon script', 'My script')) : GA.L('Mon script', 'My script');
    var needsImage = start ? start.getFieldValue('NEEDS') === 'TRUE' : true;
    var settings = GA.getSettings(ws);
    var params = needsImage ? ['image', 'drawable'] : [];
    params.forEach(function (p) { ctx.reserveName(p); });
    settings.forEach(function (s) {
      var n = s.name;
      if (GA.RESERVED[n]) n = n + '_reglage';
      s.py = n;
      ctx.settings[s.raw] = s;
      ctx.settings[s.name] = s;
      ctx.reserveName(n);
      params.push(n);
    });
    // corps
    G.STATEMENT_PREFIX = '#@@%1\n';
    var body = '';
    try { body = start ? G.statementToCode(start, 'DO') : ''; } finally { G.STATEMENT_PREFIX = null; }
    var bodyLines = [];
    var stack = [];
    body.split('\n').forEach(function (line, bi, barr) {
      if (line === '' && bi === barr.length - 1) return;
      line = line.replace(/\u0001[^\u0002]*\u0002/g, '').replace(/\u0006[^\u0007]*\u0007/g, '').replace(/\u0000/g, '');
      var mm = line.match(/^(\s*)#@@'(.*)'$/);
      if (mm) {
        var ind = mm[1].length;
        while (stack.length && stack[stack.length - 1].ind >= ind) stack.pop();
        stack.push({ ind: ind, id: mm[2] });
        return;
      }
      if (line.trim() !== '') {
        var li = line.length - line.replace(/^\s+/, '').length;
        while (stack.length > 1 && stack[stack.length - 1].ind > li) stack.pop();
      }
      bodyLines.push({ t: line, id: stack.length ? stack[stack.length - 1].id : null });
    });
    // réglages (constantes CHOIX_ + tuples PF_)
    var pfLines = [];
    settings.forEach(function (s) {

    });
    if (opts.errors) ctx.imp('traceback');
    (opts.extraImports || []).forEach(function (m) { ctx.imp(m); });

    var L = [];
    function add(t, id) { L.push({ t: t, id: id || null }); }
    var menu = GA.menuFor(ws, opts);
    var fn = GA.procNameFor(ws, opts).replace(/-/g, '_');
    add('#!/usr/bin/env python');
    add('# -*- coding: utf-8 -*-');
    add('#');
    add('# ' + label + (opts.blurb ? ' - ' + opts.blurb.replace(/\n/g, ' ') : ''));
    add(GA.L('# Plug-in pour GIMP 2.10 (Python 2.7), cree avec GIMP Code Block - Plug-in Maker.', '# Plug-in for GIMP 2.10 (Python 2.7), made with GIMP Code Block - Plug-in Maker.'));
    add(GA.L('# Installation : copier ce fichier dans le dossier plug-ins de GIMP puis redemarrer GIMP.', '# Install: copy this file into the GIMP plug-ins folder, then restart GIMP.'));
    add('# Menu : ' + menu.replace(/^<Image>\//, '').replace(/\//g, ' > ') + ' > ' + label);
    add('#');
    add('from gimpfu import *');
    Object.keys(ctx.imports).sort().forEach(function (m) { add('import ' + m); });
    if (ctx.consts.length) {
      add('');
      ctx.consts.forEach(function (c) { add(c.t, c.id); });
    }
    // aides, dans un ordre stable (dépendances d'abord)
    var order = [];
    function visit(h) {
      if (order.indexOf(h) >= 0) return;
      GA.HELPERS[h].deps.forEach(visit);
      order.push(h);
    }
    Object.keys(GA.HELPERS).forEach(function (h) { if (ctx.helpers[h]) visit(h); });
    order.forEach(function (h) {
      add(''); add('');
      GA.HELPERS[h].code.forEach(function (t) { add(t); });
    });
    add(''); add('');
    add('def _actions(' + params.join(', ') + '):');
    add(GA.L('    """Ce que fait le plug-in (genere a partir des blocs)."""', '    """What the plug-in does (generated from the blocks)."""'));
    var seen = {};
    ctx.varOrder.forEach(function (v) { if (!seen[v]) { seen[v] = true; add('    ' + v + ' = None'); } });
    if (bodyLines.length) bodyLines.forEach(function (l) { L.push(l); });
    else add('    pass');
    add(''); add('');
    add('def ' + fn + '(' + params.join(', ') + '):');
    var inner = '_actions(' + params.join(', ') + ')';
    if (needsImage && opts.undo) add('    pdb.gimp_image_undo_group_start(image)');
    if (opts.context) add('    pdb.gimp_context_push()');
    if (opts.errors) {
      add('    try:');
      add('        ' + inner);
      add('    except Exception:');
      add('        pdb.gimp_message(' + GA.pyStr(GA.L('Erreur dans le plug-in « ' + label + ' » :\n', 'Error in the plug-in "' + label + '":\n')) + ' + traceback.format_exc())');
    } else add('    ' + inner);
    if (opts.context) add('    pdb.gimp_context_pop()');
    if (needsImage && opts.undo) add('    pdb.gimp_image_undo_group_end(image)');
    if (opts.flush) add('    gimp.displays_flush()');
    add(''); add('');
    add('register(');
    add('    ' + GA.pyStr(GA.procNameFor(ws, opts)) + ',');
    add('    ' + GA.pyStr(opts.blurb || label) + ',');
    add('    ' + GA.pyStr(opts.help || opts.blurb || label) + ',');
    add('    ' + GA.pyStr(opts.author || 'Moi') + ',');
    add('    ' + GA.pyStr(opts.copyright || opts.author || 'Moi') + ',');
    add('    ' + GA.pyStr(opts.date || '2026') + ',');
    add('    ' + GA.pyStr(label) + ',');
    add('    ' + GA.pyStr(needsImage ? '*' : '') + ',');
    add('    [');
    if (needsImage) {
      add('        (PF_IMAGE, "image", "Image", None),');
      add('        (PF_DRAWABLE, "drawable", ' + GA.pyStr(GA.L('Calque actif', 'Active layer')) + ', None),');
    }

};

/* ================= rechercher / remplacer ================= */
GA.find = (function () {
  var hits = [], cur = -1, bar;
  function fieldsOf(b) {
    var out = [];
    b.inputList.forEach(function (inp) { inp.fieldRow.forEach(function (f) { if (f.name && f.EDITABLE !== undefined && (f instanceof Blockly.FieldTextInput || f instanceof Blockly.FieldDropdown || f instanceof Blockly.FieldLabelSerializable)) out.push(f); }); });
    return out;
  }
  function editable(f) { return f instanceof Blockly.FieldTextInput && !(f instanceof Blockly.FieldNumber) || (Blockly.FieldMultilineInput && f instanceof Blockly.FieldMultilineInput); }
  function rx() {
    var q = bar.querySelector('#fQ').value;
    if (!q) return null;
    var e = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    if (bar.querySelector('#fW').checked) e = '\\b' + e + '\\b';
    return new RegExp(e, bar.querySelector('#fC').checked ? 'g' : 'gi');
  }
  function search() {
    hits = []; cur = -1;
    var re = rx();
    if (re) {
      var hat = GA.getHat(ws()), all = [];
      ws().getTopBlocks(true).forEach(function (t) { all = all.concat(t.getDescendants(true)); });
      all.forEach(function (b) {
        if (b.isShadow() && !b.getParent()) return;
        fieldsOf(b).forEach(function (f) { var txt = String(f.getText ? f.getText() : f.getValue()); re.lastIndex = 0; if (re.test(txt)) hits.push({ b: b, f: f }); });
      });
    }
    bar.querySelector('#fN').textContent = hits.length ? '0/' + hits.length : (rx() ? T('aucun résultat') : '');
  }
  function go(dir) {
    if (!hits.length) search();
    if (!hits.length) return;
    cur = (cur + dir + hits.length) % hits.length;
    var h = hits[cur], b = h.b;
    while (b.isShadow() && b.getParent()) b = b.getParent();
    GA.reveal(b);
    bar.querySelector('#fN').textContent = (cur + 1) + '/' + hits.length;
  }
  function replaceOne(all) {
    var re = rx();
    if (!re) return;
    var rep = bar.querySelector('#fR').value, n = 0;
    if (!hits.length) search();
    var list = all ? hits : (cur >= 0 ? [hits[cur]] : hits.slice(0, 1));
    Blockly.Events.setGroup(true);
    try {
      list.forEach(function (h) {
        if (!editable(h.f)) return;
        var v = String(h.f.getValue()), nv = v.replace(re, rep);
        if (nv !== v) { h.f.setValue(nv); n++; }
      });
    } finally { Blockly.Events.setGroup(false); }
    GA.toast(n + ' ' + T('remplacement(s)') + (n < list.length ? ' — ' + T('les étiquettes et menus ne sont pas modifiables') : ''));
    search(); if (!all) go(1);
  }
  return {
    init: function () {
      bar = $('#findBar');
      if (!bar) return;
      bar.querySelector('#fQ').addEventListener('input', search);
      bar.querySelector('#fQ').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); go(e.shiftKey ? -1 : 1); } if (e.key === 'Escape') GA.find.close(); });
      bar.querySelector('#fR').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); replaceOne(false); } if (e.key === 'Escape') GA.find.close(); });
      ['#fC', '#fW'].forEach(function (s) { bar.querySelector(s).addEventListener('change', search); });
      bar.querySelector('#fNext').onclick = function () { go(1); };
      bar.querySelector('#fPrev').onclick = function () { go(-1); };
      bar.querySelector('#fRep').onclick = function () { replaceOne(false); };
      bar.querySelector('#fRepAll').onclick = function () { replaceOne(true); };
      bar.querySelector('#fClose').onclick = function () { GA.find.close(); };
    },
    open: function (withReplace) {
      bar.hidden = false;
      bar.classList.toggle('rep', !!withReplace);
      var q = bar.querySelector('#fQ'); q.focus(); q.select();
      search();
    },
    close: function () { bar.hidden = true; }
  };
})();

/* ================= liste des fonctions (aller à…) ================= */
GA.openFunctions = function () {
  var built = GA.app.getBuilt(), items = [];
  ws().getAllBlocks(true).forEach(function (b) {
    if (!/^(py_def|py_class|g_start)$/.test(b.type)) return;
    var ln = built ? built.lines.findIndex(function (l) { return l.id === b.id; }) + 1 : 0;
    var label = b.type === 'g_start' ? '▶ ' + b.getFieldValue('LABEL') : (b.type === 'py_class' ? 'class ' : 'def ') + b.getFieldValue('NAME') + (b.type === 'py_def' ? '(' + b.getFieldValue('ARGS') + ')' : '');
    var depth = 0, p = b.getSurroundParent(); while (p) { depth++; p = p.getSurroundParent(); }
    items.push({ b: b, ln: ln || 1e9, label: label, depth: depth, folded: b.isCollapsed() });
  });
  items.sort(function (a, b) { return a.ln - b.ln; });
  var d = GA.app.openDialog('<h2>📋 ' + T('Liste des fonctions') + '</h2><p class="sub">' + items.length + ' ' + T('fonction(s) — clique pour y aller') + '</p>' +
    '<div class="pickHead"><input id="fnQ" type="search" placeholder="' + T('Filtrer…') + '" autofocus></div><div class="pickList" id="fnL"></div>' +
    '<div class="foot"><button class="btn" id="fnC">' + T('Fermer') + '</button></div>', 'wide');
  function render() {
    var q = d.querySelector('#fnQ').value.toLowerCase();
    d.querySelector('#fnL').innerHTML = items.filter(function (it) { return !q || it.label.toLowerCase().indexOf(q) >= 0; }).map(function (it, i) {
      return '<button class="pick" data-i="' + items.indexOf(it) + '" style="margin-left:' + it.depth * 18 + 'px"><code>' + esc(it.label) + '</code><span class="bl">' + (it.ln < 1e9 ? T('ligne') + ' ' + it.ln : '') + (it.folded ? ' · ' + T('repliée') : '') + '</span></button>';
    }).join('');
  }
  d.querySelector('#fnQ').oninput = render;
  d.querySelector('#fnL').onclick = function (e) { var p = e.target.closest('.pick'); if (!p) return; GA.app.closeDialog(); var it = items[+p.getAttribute('data-i')]; GA.reveal(it.b); };
  d.querySelector('#fnC').onclick = GA.app.closeDialog;
  render();
};

    .then(function (text) { setBusy(false); handleAnswer(ctx, text); },

function showResult(ctx, code, v, text) {

    '<ul class="aiChecks">' + v.errors.map(function (e) { return '<li class="err">🛑 ' + esc(msgOf(e)) + '</li>'; }).join('') + v.warnings.map(function (e) { return '<li class="warn">⚠️ ' + esc(msgOf(e)) + '</li>'; }).join('') +
    (ok ? '<li>✔ ' + T('Syntaxe Python 2.7, fonctions de GIMP 2.10 et nombre d\'arguments vérifiés') + '</li>' : '') + '</ul>' +

    '<button class="btn" data-a="copy">📋 ' + T('Copier le code') + '</button>' +
    (prov().kind !== 'manual' ? '<button class="btn" data-a="again">🔧 ' + T('Redemander une correction') + '</button>' : '') + '</div>';
  item.innerHTML = html;

  });

/* ================= insertion des blocs ================= */
function lastOf(b) { while (b.getNextBlock()) b = b.getNextBlock(); return b; }
function insertCode(code, replaceRun) {
  return GA.importPython(code, 'ia').then(function (r) {
    var hat = r.state.blocks.blocks[0], first = hat.inputs && hat.inputs.DO && hat.inputs.DO.block;
    if (!first) { GA.toast('Le code ne contient aucune instruction.'); return 0; }
    var w = ws(), n = 0;
    Blockly.Events.setGroup(true);
    try {
      var nb = Blockly.serialization.blocks.append(first, w), last = lastOf(nb);
      var cnt = function (b) { var k = 0; while (b) { k += b.getDescendants(false).length; b = null; } return k; };
      n = r.count - 1;
      var conn = null, after = null;
      if (replaceRun && replaceRun.length && !replaceRun[0].disposed) {
        var f0 = replaceRun[0], l0 = replaceRun[replaceRun.length - 1];
        conn = f0.previousConnection && f0.previousConnection.targetConnection;
        after = l0.getNextBlock();
        var xy = f0.getRelativeToSurfaceXY();
        if (after) after.unplug(false);
        f0.unplug(false);
        f0.dispose(false);
        if (!conn) nb.moveBy(xy.x, xy.y);
        GA.selClear();
      } else {
        var sel = Blockly.common.getSelected && Blockly.common.getSelected();
        if (sel && sel.workspace === w && sel.nextConnection && sel.type !== 'g_start' && sel.type !== 'py_file' && !sel.isShadow()) { conn = sel.nextConnection; after = sel.getNextBlock(); if (after) after.unplug(false); }
        else {
          var hatB = GA.getHat(w), isDef = first.type === 'py_def' || first.type === 'py_class' || first.type === 'py_decorator';
          var target = null, b = hatB && hatB.getInputTargetBlock('DO');
          if (isDef) while (b) { if (b.type === 'py_callst' && /^(register|main)$/.test(b.getFieldValue && b.getFieldValue('FUNC') || '')) break; target = b; b = b.getNextBlock(); }
          else { target = b ? lastOf(b) : null; }
          if (target) { conn = target.nextConnection; after = target.getNextBlock(); if (after) after.unplug(false); }
          else if (hatB) { conn = hatB.getInput('DO').connection; after = hatB.getInputTargetBlock('DO'); if (after) after.unplug(false); }
        }
      }
      if (conn) conn.connect(nb.previousConnection);
      if (after) last.nextConnection.connect(after.previousConnection);
      var sel2 = [], x = nb; while (x) { sel2.push(x); if (x === last) break; x = x.getNextBlock(); }
      setTimeout(function () { GA.selectBlocks(sel2); GA.reveal(nb); }, 30);
    } finally { Blockly.Events.setGroup(false); }
    GA.toast(n + ' ' + T('bloc(s) ajouté(s) par l\'IA — Ctrl+Z pour annuler'));
    return n;
  });
}

function decodeBytes(u8) {
  var s;
  try { s = new TextDecoder('utf-8', { fatal: true, ignoreBOM: true }).decode(u8); }
  catch (e) { s = new TextDecoder('windows-1252').decode(u8); }
  return s;
}
function readZip(buf) {
  var dv = new DataView(buf), u8 = new Uint8Array(buf), eocd = -1;
  for (var i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 70000); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) return Promise.reject(new Error('zip illisible'));
  var count = dv.getUint16(eocd + 10, true), off = dv.getUint32(eocd + 16, true), entries = [];
  for (var k = 0; k < count; k++) {
    if (dv.getUint32(off, true) !== 0x02014b50) break;
    var method = dv.getUint16(off + 10, true), csize = dv.getUint32(off + 20, true), nlen = dv.getUint16(off + 28, true);
    var elen = dv.getUint16(off + 30, true), clen = dv.getUint16(off + 32, true), local = dv.getUint32(off + 42, true);
    var name = decodeBytes(u8.subarray(off + 46, off + 46 + nlen));
    entries.push({ name: name, method: method, csize: csize, local: local });
    off += 46 + nlen + elen + clen;
  }
  var e = entries.filter(function (x) { return /\.py$/i.test(x.name) && !/(^|\/)__MACOSX\//.test(x.name); })[0];
  if (!e) return Promise.reject(new Error('aucun fichier .py dans ce zip'));
  var lh = e.local, start = lh + 30 + dv.getUint16(lh + 26, true) + dv.getUint16(lh + 28, true);
  var data = u8.subarray(start, start + e.csize);
  if (e.method === 0) return Promise.resolve({ name: e.name.split('/').pop(), bytes: data });
  if (e.method === 8 && typeof DecompressionStream !== 'undefined') {
    return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()
      .then(function (b) { return { name: e.name.split('/').pop(), bytes: new Uint8Array(b) }; });
  }
  return Promise.reject(new Error('compression du zip non gérée'));
}
function handleFile(f) {
  var name = f.name || 'script.py';
  var r = new FileReader();
  r.onload = function () {
    var buf = r.result;
    if (/\.json$/i.test(name)) {
      try {
        var p = JSON.parse(decodeBytes(new Uint8Array(buf)));
        if (!p || !p.ws) throw new Error('format');
        opts = Object.assign(GA.defaultOpts(), p.opts || {});
        loadState(p.ws); toast('Projet ouvert');
      } catch (e) { toast('Ce fichier n\'est pas un projet de l\'atelier.'); }
      return;
    }
    if (/\.zip$/i.test(name)) {
      readZip(buf).then(function (z) { importText(decodeBytes(z.bytes), z.name, false, z.bytes); }, function (err) { toast('Zip : ' + err.message); });
      return;
    }
    importText(decodeBytes(new Uint8Array(buf)), name, false, new Uint8Array(buf));
  };
  r.readAsArrayBuffer(f);
}
function importText(text, name, replaceOk, bytes) {
  if (!replaceOk && !isEmptyProject()) {
    confirmBox('Remplacer ton projet ?', 'Le script importé va remplacer les blocs actuels. Sauvegarde ton projet avant si tu veux le garder (📂 Projet ▸ Sauvegarder).', 'Importer', function (ok) { if (ok) importText(text, name, true, bytes); });
    return;
  }
  var nlines = text.split('\n').length;
  openDialog('<h2>🐍 Import en cours…</h2><p class="sub">' + esc(name) + ' · ' + nlines + ' lignes. Les gros scripts prennent quelques secondes.</p>');
  setTimeout(function () {
    GA.importPython(text, name.replace(/\.(py|txt)$/i, '')).then(function (res) {
      if (res.opts) opts = Object.assign(GA.defaultOpts(), res.opts);
      else opts = Object.assign(GA.defaultOpts(), { crlf: opts.crlf });
      loadState(res.state);
      dlgClose = null; closeDialog();
      res.origText = text; res.origBytes = bytes || null;
      importReport(res);
    }).catch(function (err) {
      console.error(err);
      dlgClose = null; closeDialog();
      toast('Import impossible : ' + (err.message || err));
    });
  }, 60);
}
function importReport(res) {
  var h = '<h2>✅ Script importé</h2><p class="sub">' + esc(res.name) + '.py</p>';
  var nb = ws.getAllBlocks(false).length;
  // LE test d'identité : le fichier que l'atelier exporterait est-il exactement l'original ?
  var identical = null, nbytes = 0;
  if (built && built.mode === 'file' && res.via !== 'blocs') {

  if (identical === true) h += '<div class="okline">🧊 ⇄ 💧 Test d\'identité réussi : le fichier que l\'atelier exporte est <b>identique octet pour octet</b> à ton fichier (' + nbytes.toLocaleString('fr-FR') + ' octets).</div>';
  else if (identical === false) h += '<div class="status warn">⚠️ Le fichier exporté ne serait pas identique octet pour octet à l\'original (la structure Python, elle, est vérifiée ci-dessous).</div>';
  if (res.via === 'blocs') {

    if (v && v.ok) h += '<li>✔ <b>Aller-retour vérifié</b> : le code produit par les blocs a exactement la même structure Python que ton fichier (' + v.statements + ' instructions, ' + v.comments + ' commentaires conservés).</li>';
    else if (v) h += '<li>⚠️ Vérification incomplète : ' + esc(v.why || (v.sameCode ? 'commentaires déplacés' : 'structure différente')) + '.</li>';
    if (res.edited) h += '<li>ℹ️ Ce fichier venait de l\'atelier mais a été modifié à la main : les blocs ont été reconstruits depuis le code.</li>';
    if (res.via === 'partiel') {

        res.raws.map(function (x) { return x.from + (x.to > x.from ? '-' + x.to : ''); }).join(', ') + ' sont gardées telles quelles dans un bloc 🧱 code brut ; tout le reste est en blocs.</li>';

    h += '<li>⬇ Tant que tu ne changes rien, le téléchargement redonne exactement ce fichier. Si tu modifies des blocs, seules les lignes touchées changent (réécrites en forme standard).</li></ul>';
  }
  var d = openDialog(h + '<div class="foot"><button class="btn" id="rCode">🐍 Voir le code</button><button class="btn primary" id="rOk" autofocus>OK</button></div>');
